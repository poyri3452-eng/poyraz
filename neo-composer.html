<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neo Liquid Glass Composer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--e:cubic-bezier(.22,1,.36,1)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:#0e0b09;color:#fbf6ef;-webkit-font-smoothing:antialiased;overflow:hidden}
button,textarea{font:inherit;color:inherit}

/* ═══════════ LIQUID GLASS COMPOSER ═══════════ */
/* mod seçici — renksiz, sade */
.mode{appearance:none;border:0;align-self:flex-end;flex:none;height:36px;margin-bottom:2px;border-radius:999px;padding:0 10px 0 13px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:14px;font-weight:500;color:rgba(255,248,240,.82);background:transparent;transition:background .25s,color .25s,transform .45s var(--e)}
.mode:hover,.mode[aria-expanded="true"]{background:rgba(255,255,255,.07);color:#fffaf3}
.mode:active{transform:scale(.95)}
.mode .chev{width:14px;height:14px;opacity:.5;transition:transform .45s var(--e)}
.mode[aria-expanded="true"] .chev{transform:rotate(180deg)}
.mode .nm{display:inline-block;transition:opacity .22s,filter .22s,transform .35s var(--e)}
.mode .nm.out{opacity:0;filter:blur(3px);transform:translateY(-4px)}

/* menü: düğmenin içinden cam gibi büyüyerek açılır */
.menu{position:absolute;left:calc(var(--w,360px) / -2);top:calc(var(--h,56px) / -2 - 10px);--ty:-100%;width:min(280px,calc(100vw - 32px));padding:5px;border-radius:20px;
  -webkit-backdrop-filter:blur(28px) saturate(150%);backdrop-filter:blur(28px) saturate(150%);
  background:rgba(34,30,27,.72);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.14),inset 0 0 0 .5px rgba(255,255,255,.1),0 24px 60px -12px rgba(0,0,0,.65);
  transform:translateY(var(--ty));opacity:0;pointer-events:none;
  clip-path:inset(calc(100% - 38px) calc(100% - var(--cw,120px)) 0 0 round 19px);
  transition:clip-path .55s cubic-bezier(.32,1.25,.5,1),opacity .18s}
.menu.show{opacity:1;pointer-events:auto;clip-path:inset(0 0 0 0 round 20px)}
.menu.down{top:calc(var(--h,56px) / 2 + 10px);--ty:0px;clip-path:inset(0 calc(100% - var(--cw,120px)) calc(100% - 38px) 0 round 19px)}
.menu.down.show{clip-path:inset(0 0 0 0 round 20px)}
.menu .it{display:flex;align-items:center;gap:10px;width:100%;appearance:none;border:0;background:none;text-align:left;padding:9px 12px;border-radius:15px;cursor:pointer;color:#fffaf3;opacity:0;transition:background .2s,opacity .25s}
.menu.show .it{opacity:1;transition:background .2s,opacity .35s calc(80ms + var(--i)*25ms)}
.menu .it:hover,.menu .it:focus-visible{background:rgba(255,255,255,.07);outline:none}
.menu .tx{min-width:0;flex:1}
.menu b{display:block;font-size:14px;font-weight:500;color:rgba(255,250,243,.95)}
.menu small{display:block;font-size:12.5px;color:rgba(255,246,236,.45);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu .ck{flex:none;width:16px;height:16px;fill:none;stroke:rgba(255,250,243,.9);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.menu .ck path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .4s var(--e) .1s}
.menu .it[aria-checked="true"] .ck path{stroke-dashoffset:0}
.menu .sep{height:1px;margin:4px 12px;background:rgba(255,255,255,.07)}
.voice{appearance:none;border:0;background:none;align-self:flex-end;flex:none;width:40px;height:40px;margin:0 -12px 0 0;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:rgba(255,246,236,.72);transition:color .3s,background .3s,transform .5s var(--e)}
.voice:hover{color:#fff4e6;background:rgba(255,255,255,.07)}
.voice:active{transform:scale(.88)}
.voice svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;overflow:visible}
.voice .b{transform-box:fill-box;transform-origin:center;animation:idle 2.4s ease-in-out infinite}
.voice .b1{animation-delay:-.2s}.voice .b2{animation-delay:-.5s}.voice .b3{animation-delay:-.9s}.voice .b4{animation-delay:-1.3s}.voice .b5{animation-delay:-1.6s}
.voice:hover .b{animation-duration:1.2s}
.voice[aria-pressed="true"]{color:#f0c99d;background:rgba(240,201,157,.14)}
.voice[aria-pressed="true"] .b{animation:talk .7s ease-in-out infinite}
.voice[aria-pressed="true"] .b2{animation-delay:-.15s}.voice[aria-pressed="true"] .b3{animation-delay:-.35s}.voice[aria-pressed="true"] .b4{animation-delay:-.55s}.voice[aria-pressed="true"] .b5{animation-delay:-.25s}
@keyframes idle{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.55)}}
@keyframes talk{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1.25)}}
.open .voice{margin-bottom:2px}

.dock{position:fixed;left:50%;top:58%;z-index:2}
.composer{
  --w:360px;--h:56px;--r:28px;--s:1;--mx:50%;--my:0%;
  position:relative;width:var(--w);height:var(--h);border-radius:var(--r);transform:translateX(-50%) scale(calc(var(--s)*var(--sx,1)),calc(var(--s)*var(--sy,1)));
  left:0;margin-left:0;cursor:text;isolation:isolate;
  /* yedek: tüm tarayıcılarda buzlu cam */
  -webkit-backdrop-filter:blur(22px) saturate(160%) brightness(1.05);
  backdrop-filter:blur(22px) saturate(160%) brightness(1.05);
  background:radial-gradient(120% 140% at 30% 0%,rgba(255,250,244,.16),rgba(255,250,244,.05) 60%,rgba(255,250,244,.03));
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.22),
    inset 0 -8px 18px rgba(255,255,255,.035),
    inset 0 0 0 .5px rgba(255,255,255,.12),
    inset 0 0 30px rgba(255,255,255,.05),
    0 24px 60px -12px rgba(10,5,2,.45);
  transform-origin:50% 50%;margin-top:calc(var(--h) / -2);
}
/* Chromium: gerçek kırılma (SVG yer değiştirme haritası) */
.composer.refract{backdrop-filter:url(#liquid) blur(10px) saturate(165%) brightness(1.06)}
/* kenardaki parlak ışık + imleci takip eden parıltı */
.composer::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.32),rgba(255,255,255,.04) 30%,rgba(255,255,255,0) 60%,rgba(255,255,255,.1));filter:blur(.4px);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.composer::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.7;
  background:radial-gradient(220px 120px at var(--mx) var(--my),rgba(255,255,255,.1),transparent 70%);transition:opacity .3s}

.inner{position:absolute;inset:0;display:flex;flex-direction:column;padding:8px 22px 8px 10px;overflow:hidden;border-radius:inherit}
.top{flex:1;display:flex;align-items:stretch;gap:8px;min-height:40px}
textarea{flex:1;resize:none;border:0;outline:none;background:transparent;font-size:15.5px;line-height:22px;padding:9px 0;transition:padding .5s var(--e);max-height:180px;color:#fffaf3;caret-color:#f0c99d;scrollbar-width:none}
textarea::placeholder{color:rgba(255,246,236,.55)}
.open textarea{padding-top:14px;padding-left:12px}
.open .mode{position:absolute;left:10px;bottom:8px;margin:0}




@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>

<!-- sıvı cam için kırılma filtresi (harita JS ile üretilir) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="liquid" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feImage id="lqMap" x="0" y="0" width="360" height="56" preserveAspectRatio="none" result="map"/>
    <feDisplacementMap in="SourceGraphic" in2="map" scale="-38" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="dock" id="dock">
  <div class="menu" id="menu" role="menu" aria-label="Modlar"></div>
  <div class="composer" id="composer">
    <div class="inner">
      <div class="top">
        <button class="mode" id="modeBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu">
          <span class="nm" id="modeName">Adaptive</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
        </button>
        <textarea id="ta" rows="1" placeholder="Neo'ya bir şey sor…" aria-label="Mesaj"></textarea>
        <button class="voice" id="voice" type="button" aria-label="Sesli sohbet" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="b b1" d="M5 10.5v3"/><path class="b b2" d="M8.5 8v8"/><path class="b b3" d="M12 5v14"/><path class="b b4" d="M15.5 8v8"/><path class="b b5" d="M19 10.5v3"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const comp = $('composer'), ta = $('ta');

/* ── yay (spring): hafif esnek, küçük bir taşma ile oturur ── */
class Spring{
  constructor(x, k=120, c=12.5){ this.x=x; this.v=0; this.to=x; this.k=k; this.c=c; }
  step(dt){ if(REDUCED){ this.x=this.to; return this.x; } const a=this.k*(this.to-this.x)-this.c*this.v; this.v+=a*dt; this.x+=this.v*dt; return this.x; }
  get rest(){ return Math.abs(this.to-this.x)<.05 && Math.abs(this.v)<.05; }
}
const S = { w:new Spring(360), h:new Spring(56), r:new Spring(28), s:new Spring(1,260,14) };

let open = false;
function sizes(){
  const vw = innerWidth;
  const closedW = Math.min(440, vw-32), openW = Math.min(680, vw-24);
  if(!open) return {w:closedW, h:56, r:28};
  // metin kadar uzar: textarea + araç çubuğu
  ta.style.height = 'auto';
  const th = Math.min(180, Math.max(44, ta.scrollHeight));
  ta.style.height = th + 'px';
  return {w:openW, h:Math.max(112, th + 30 + 40), r:34};
}
function retarget(){ const z = sizes(); S.w.to = z.w; S.h.to = z.h; S.r.to = z.r; kick(); }

function expand(){ if(open) return; open = true; comp.classList.add('open'); retarget(); }
function collapse(){ if(!open || ta.value.trim()) return; open = false; comp.classList.remove('open'); ta.style.height = ''; retarget(); }

/* basınca hafifçe ezilir, bırakınca genişler */
comp.addEventListener('pointerdown', e => { if(e.target.closest('.voice,.mode')) return; S.s.to = .965; kick(); setTimeout(() => ta.focus(), 0); });
addEventListener('pointerup', () => { S.s.to = 1; kick(); });
ta.addEventListener('focus', expand);
document.addEventListener('pointerdown', e => { if(!e.target.closest('#menu,#modeBtn')) closeMenu(); if(!comp.contains(e.target) && !e.target.closest('#menu')) collapse(); });
ta.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ ta.blur(); collapse(); }
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); submit(); }
});
ta.addEventListener('input', retarget);

/* imleci takip eden parıltı */
comp.addEventListener('pointermove', e => { const r = comp.getBoundingClientRect(); comp.style.setProperty('--mx', (e.clientX-r.left)+'px'); comp.style.setProperty('--my', (e.clientY-r.top)+'px'); });


/* ── gönder: kutu bir an sıkışıp esner, metin temizlenir (demo) ── */
function submit(){
  if(!ta.value.trim()) return;
  ta.value = ''; retarget();
  S.s.to = .94; kick(); setTimeout(() => { S.s.to = 1; kick(); }, 140);
}

/* ── modlar (Neo'daki modlar, animasyonlu ikonlarla) ── */
const MODES = [
  {id:'adaptive',  name:'Adaptive',      desc:'Soruya göre en uygun yanıt'},
  {id:'fast',      name:'Fast',          desc:'Ultra hızlı, özet yanıtlar'},
  {id:'deepthink', name:'DeepThink',     desc:'Derin analiz, adım adım düşünce'},
  {id:'sun11',     name:'Sun 1.1',       desc:'Yapılandırılmış, aydınlatıcı yanıtlar'},
  {id:'profundus', name:'Profundus 1.1', desc:'Felsefi derinlik, katmanlı düşünce'},
  {id:'ultimate',  name:'Ultimate 1.1',  desc:'Maksimum detay, kapsamlı analiz'},
];
const menu = $('menu'), modeBtn = $('modeBtn'), dock = $('dock');
let mode = 'adaptive';
const ck = '<svg class="ck" viewBox="0 0 24 24" aria-hidden="true"><path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
MODES.forEach((m,i) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'it'; b.setAttribute('role','menuitemradio');
  b.dataset.id = m.id; b.style.setProperty('--i', i);
  b.innerHTML = `<span class="tx"><b></b><small></small></span>${ck}`;
  b.querySelector('b').textContent = m.name; b.querySelector('small').textContent = m.desc;
  b.addEventListener('click', () => { setMode(m.id); setTimeout(() => { closeMenu(); ta.focus(); }, 220); });
  if(i === 1) { const sp = document.createElement('div'); sp.className = 'sep'; menu.append(sp); }
  menu.append(b);
});
function setMode(id, first){
  const m = MODES.find(x => x.id === id); mode = id;
  menu.querySelectorAll('.it').forEach(b => b.setAttribute('aria-checked', b.dataset.id === id));
  const nm = $('modeName');
  if(first){ nm.textContent = m.name; return; }
  nm.classList.add('out');
  setTimeout(() => { nm.textContent = m.name; nm.classList.remove('out'); retarget(); }, 200);
  S.s.to = .97; kick(); setTimeout(() => { S.s.to = 1; kick(); }, 120);
}
function openMenu(){ menu.style.setProperty('--cw', modeBtn.offsetWidth + 'px'); const r = comp.getBoundingClientRect(); menu.classList.toggle('down', r.top < menu.offsetHeight + 16 && innerHeight - r.bottom > r.top); menu.classList.add('show'); modeBtn.setAttribute('aria-expanded','true'); (menu.querySelector('[aria-checked="true"]')||menu.firstChild).focus({preventScroll:true}); }
function closeMenu(){ if(!menu.classList.contains('show')) return; menu.classList.remove('show'); modeBtn.setAttribute('aria-expanded','false'); }
modeBtn.addEventListener('click', () => menu.classList.contains('show') ? closeMenu() : openMenu());
menu.addEventListener('keydown', e => {
  const items = [...menu.querySelectorAll('.it')], k = items.indexOf(document.activeElement);
  if(e.key === 'ArrowDown'){ e.preventDefault(); items[(k+1)%items.length].focus(); }
  if(e.key === 'ArrowUp'){ e.preventDefault(); items[(k-1+items.length)%items.length].focus(); }
  if(e.key === 'Escape'){ closeMenu(); modeBtn.focus(); }
});
setMode('adaptive', true);

/* ── sesli sohbet ikonu ── */
const voice = $('voice');
voice.addEventListener('click', () => {
  const on = voice.getAttribute('aria-pressed') !== 'true';
  voice.setAttribute('aria-pressed', on);
  S.s.to = .97; kick(); setTimeout(() => { S.s.to = 1; kick(); }, 110);
});

/* ── kırılma haritası: kenara yaklaştıkça içe doğru büken yer değiştirme ── */
const REFRACT = CSS.supports('backdrop-filter','url(#liquid)') && /Chrome|Chromium|Edg\//.test(navigator.userAgent) && !/Firefox/.test(navigator.userAgent);
function buildMap(W, H, R, bezel){
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'), img = x.createImageData(W, H), d = img.data;
  const hw = W/2, hh = H/2;
  const sdf = (px,py) => { const qx = Math.abs(px-hw)-(hw-R), qy = Math.abs(py-hh)-(hh-R); return Math.hypot(Math.max(qx,0),Math.max(qy,0)) + Math.min(Math.max(qx,qy),0) - R; };
  for(let j=0;j<H;j++) for(let i=0;i<W;i++){
    const px = i+.5, py = j+.5, s = sdf(px,py);
    let dx = 0, dy = 0;
    if(s < 0 && s > -bezel){
      const gx = sdf(px+1,py)-sdf(px-1,py), gy = sdf(px,py+1)-sdf(px,py-1), gl = Math.hypot(gx,gy)||1;
      const t = 1 + s/bezel;                 // 1 = kenarda, 0 = kenarlıktan içeride
      const m = t*t*(3-2*t);                 // yumuşak geçiş
      dx = gx/gl*m; dy = gy/gl*m;
    }
    const k = (j*W+i)*4;
    d[k] = 128 + dx*127; d[k+1] = 128 + dy*127; d[k+2] = 128; d[k+3] = 255;
  }
  x.putImageData(img, 0, 0);
  return c.toDataURL();
}
const lqMap = $('lqMap');
let mapKey = '';
function updateMap(w, h, r){
  // boyut belirgin değişince yeniden üret (ucuz: küçük tuval)
  const key = [Math.round(w/40), Math.round(h/12), Math.round(r)].join('x');
  if(key !== mapKey){ mapKey = key; lqMap.setAttribute('href', buildMap(Math.round(w/2), Math.round(h/2), r/2, Math.min(14, h/4))); }
  lqMap.setAttribute('width', w); lqMap.setAttribute('height', h);
}
if(REFRACT) comp.classList.add('refract');

/* ── animasyon döngüsü (yalnızca hareket varken çalışır) ── */
let running = false, last = 0;
function kick(){ if(!running){ running = true; last = performance.now(); requestAnimationFrame(tick); } }
function tick(now){
  const dt = Math.min(.032, (now-last)/1000); last = now;
  const w = S.w.step(dt), h = S.h.step(dt), r = S.r.step(dt), s = S.s.step(dt);
  comp.style.setProperty('--w', w+'px'); comp.style.setProperty('--h', h+'px'); dock.style.setProperty('--w', w+'px'); dock.style.setProperty('--h', h+'px');
  comp.style.setProperty('--r', Math.min(r, h/2)+'px'); comp.style.setProperty('--s', s);
  const jig = Math.max(-.06, Math.min(.06, S.h.v*.00035 - S.w.v*.0001));
  comp.style.setProperty('--sy', 1 + jig); comp.style.setProperty('--sx', 1 - jig*.6);
  if(REFRACT) updateMap(w, h, Math.min(r, h/2));
  if(Object.values(S).every(sp => sp.rest)){ comp.style.setProperty('--sx',1); comp.style.setProperty('--sy',1); running = false; return; }
  requestAnimationFrame(tick);
}
addEventListener('resize', retarget);
retarget();
</script>
</body>
</html>
