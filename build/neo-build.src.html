const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ---------------------------------------------------------------
   WebGL arka plan: Three.js shader (akan mavi aurora) + Neo çekirdeği
---------------------------------------------------------------- */
function NeoScene({ calm }) {
  const ref = useRef(null);
  const calmRef = useRef(calm);
  calmRef.current = calm;

  useEffect(() => {
    const host = ref.current;
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
    host.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    camera.position.set(0, 0, 6);

    // Tam ekran shader düzlemi
    const bgUniforms = {
      uTime: { value: 0 }, uRes: { value: new THREE.Vector2(1, 1) },
      uMouse: { value: new THREE.Vector2(0.5, 0.5) }, uCalm: { value: 0 },
    };
    const bg = new THREE.Mesh(
      new THREE.PlaneGeometry(2, 2),
      new THREE.ShaderMaterial({
        uniforms: bgUniforms, depthWrite: false, depthTest: false,
        vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
        fragmentShader: `
          precision highp float;
          varying vec2 vUv; uniform float uTime; uniform vec2 uRes; uniform vec2 uMouse; uniform float uCalm;
          float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
          float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
            return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }
          float fbm(vec2 p){ float v=0.0, a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.02; a*=0.5; } return v; }
          void main(){
            vec2 uv = vUv; vec2 p = (uv - 0.5) * vec2(uRes.x/uRes.y, 1.0);
            float t = uTime * 0.06;
            vec2 q = vec2(fbm(p*1.6 + t), fbm(p*1.6 - t + 3.1));
            vec2 m = (uMouse - 0.5) * 0.35;
            float f = fbm(p*1.3 + q*1.8 + m + vec2(t*0.7, -t*0.4));
            vec3 deep = vec3(0.012, 0.018, 0.05);
            vec3 blue = vec3(0.12, 0.33, 0.95);
            vec3 cyan = vec3(0.30, 0.70, 1.00);
            vec3 col = mix(deep, blue, smoothstep(0.25, 0.85, f));
            col = mix(col, cyan, smoothstep(0.62, 0.95, f) * 0.55);
            float glow = smoothstep(0.9, 0.0, length(p - vec2(0.0, 0.18)));
            col += vec3(0.08, 0.16, 0.45) * glow * 0.6;
            float vig = smoothstep(1.25, 0.25, length(p * vec2(0.9, 1.2)));
            col *= mix(0.25, 1.0, vig);
            col = mix(col, col * 0.35, uCalm);
            // ince nokta ızgarası (Bolt hissi)
            vec2 g = fract(uv * uRes / 22.0) - 0.5;
            col += vec3(0.6,0.75,1.0) * smoothstep(0.06, 0.0, length(g)) * 0.05 * vig;
            col = mix(col, deep, smoothstep(0.55, 1.0, 1.0 - uv.y) * 0.65);
            gl_FragColor = vec4(col, 1.0);
          }`,
      })
    );
    bg.frustumCulled = false; bg.renderOrder = -1;
    scene.add(bg);

    // Neo çekirdeği: tel kafes ikosahedron + parçacık halkası
    const core = new THREE.Group();
    const ico = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1, 1),
      new THREE.MeshBasicMaterial({ color: 0x7fb8ff, wireframe: true, transparent: true, opacity: 0.28 })
    );
    const inner = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.55, 2),
      new THREE.MeshBasicMaterial({ color: 0x2f7bff, transparent: true, opacity: 0.18 })
    );
    core.add(ico, inner);
    const N = 900, pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const a = Math.random() * Math.PI * 2, r = 1.6 + Math.random() * 1.4, y = (Math.random() - 0.5) * 0.35;
      pos[i * 3] = Math.cos(a) * r; pos[i * 3 + 1] = y; pos[i * 3 + 2] = Math.sin(a) * r;
    }
    const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const ring = new THREE.Points(pg, new THREE.PointsMaterial({ color: 0xa9d0ff, size: 0.018, transparent: true, opacity: 0.8 }));
    ring.rotation.x = 0.35;
    core.add(ring);
    core.position.set(0, 1.55, -2);
    scene.add(core);

    const mouse = { x: 0.5, y: 0.5, tx: 0.5, ty: 0.5 };
    const onMove = (e) => { const pt = e.touches ? e.touches[0] : e; mouse.tx = pt.clientX / innerWidth; mouse.ty = 1 - pt.clientY / innerHeight; };
    window.addEventListener('pointermove', onMove, { passive: true });

    const resize = () => {
      const w = host.clientWidth, h = host.clientHeight;
      renderer.setSize(w, h, false);
      renderer.domElement.style.width = '100%'; renderer.domElement.style.height = '100%';
      camera.aspect = w / h; camera.updateProjectionMatrix();
      bgUniforms.uRes.value.set(w, h);
      core.scale.setScalar(w < 640 ? 0.7 : 1);
    };
    resize();
    window.addEventListener('resize', resize);

    let raf, last = performance.now(), visible = true;
    const onVis = () => { visible = !document.hidden; };
    document.addEventListener('visibilitychange', onVis);
    const tick = (now) => {
      raf = requestAnimationFrame(tick);
      if (!visible) return;
      const dt = Math.min((now - last) / 1000, 0.05); last = now;
      mouse.x += (mouse.tx - mouse.x) * 0.05; mouse.y += (mouse.ty - mouse.y) * 0.05;
      bgUniforms.uTime.value += dt;
      bgUniforms.uMouse.value.set(mouse.x, mouse.y);
      bgUniforms.uCalm.value += ((calmRef.current ? 1 : 0) - bgUniforms.uCalm.value) * 0.04;
      ico.rotation.y += dt * 0.25; ico.rotation.x += dt * 0.1;
      inner.rotation.y -= dt * 0.4;
      ring.rotation.y += dt * 0.08;
      core.rotation.z = (mouse.x - 0.5) * 0.3;
      core.rotation.x = (mouse.y - 0.5) * 0.3;
      const s = 1 + Math.sin(now / 900) * 0.03; inner.scale.setScalar(s);
      renderer.render(scene, camera);
    };
    raf = requestAnimationFrame(tick);

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('resize', resize);
      document.removeEventListener('visibilitychange', onVis);
      renderer.dispose(); host.removeChild(renderer.domElement);
    };
  }, []);

  return <div ref={ref} className="fixed inset-0 -z-10 pointer-events-none" aria-hidden="true" />;
}

/* ---------------------------------------------------------------
   Yapay zekâ simülasyonu: istemden proje dosyaları üretir
---------------------------------------------------------------- */
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function detectKind(prompt, mode) {
  const p = prompt.toLowerCase();
  if (mode === 'Slides' || /sunum|slayt|slide|pitch/.test(p)) return 'slides';
  if (/todo|görev|yapılacak|task|liste/.test(p)) return 'todo';
  if (/dashboard|panel|analitik|grafik|admin|metrik/.test(p)) return 'dashboard';
  return 'landing';
}

function titleFrom(prompt) {
  const clean = prompt.replace(/^(bir|let's build|build|yap|oluştur)\s+/i, '').trim();
  const t = clean.split(/[.,\n]/)[0].slice(0, 42);
  return t ? t.charAt(0).toUpperCase() + t.slice(1) : 'Neo Projesi';
}

function generateProject(prompt, mode) {
  const kind = detectKind(prompt, mode);
  const title = esc(titleFrom(prompt));
  const css = `:root { --bg:#07080d; --fg:#eef1f8; --muted:#8b93a7; --accent:#2f7bff; --card:#11131c; --line:#1f2333; }

  let html, js, extraCss = '';
  if (kind === 'todo') {
    extraCss = `.row { display:flex; gap:8px; margin:20px 0; }

    html = `<main class="wrap">
  <h1>${title}</h1>
  <p class="muted">Neo AI ile oluşturuldu — görevlerin cihazında saklanır.</p>

    js = `const KEY = 'neo-todos';
let todos = [];
try { todos = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
if (!todos.length) todos = [{ t: 'Neo AI demosunu hazırla', d: true }, { t: 'Northeasterly One yol haritası', d: false }];

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch (e) {} };

function render() {
  list.innerHTML = '';
  todos.forEach((todo, i) => {
    const li = document.createElement('li');
    li.className = todo.d ? 'done' : '';
    li.innerHTML = '<input type="checkbox" ' + (todo.d ? 'checked' : '') + '><span></span><button>×</button>';

    li.querySelector('input').onchange = () => { todo.d = !todo.d; save(); render(); };

}

  todos.unshift({ t: input.value.trim(), d: false });

};
render();`;

/* Basit sözdizimi renklendirme */
function highlight(line, lang) {
  let s = esc(line);
  if (lang === 'js') {
    s = s.replace(/(\/\/.*)$/g, '<span class="tok-c">$1</span>')
      .replace(/('[^']*')/g, '<span class="tok-s">$1</span>')
      .replace(/\b(const|let|var|function|return|if|else|for|new|try|catch|document|addEventListener|forEach|map)\b/g, '<span class="tok-k">$1</span>')
      .replace(/\b(\d+)\b/g, '<span class="tok-n">$1</span>');
  } else if (lang === 'css') {
    s = s.replace(/^([^{}:]+)(\s*\{)/, '<span class="tok-t">$1</span>$2')
      .replace(/([\w-]+)(:)(?!\/)/g, '<span class="tok-k">$1</span>$2')
      .replace(/(#[0-9a-fA-F]{3,6})/g, '<span class="tok-n">$1</span>');
  } else {
    s = s.replace(/(&lt;\/?)([\w-]+)/g, '$1<span class="tok-t">$2</span>')
      .replace(/(&quot;[^&]*&quot;)/g, '<span class="tok-s">$1</span>');
  }
  return s;
}

function useTypewriter(list) {
  const [text, setText] = useState('');
  useEffect(() => {
    let i = 0, j = 0, del = false, t;
    const step = () => {
      const w = list[i];
      if (!del) { j++; if (j > w.length) { del = true; t = setTimeout(step, 1600); return; } }
      else { j--; if (j === 0) { del = false; i = (i + 1) % list.length; } }
      setText(w.slice(0, j));
      t = setTimeout(step, del ? 22 : 45);
    };
    step();
    return () => clearTimeout(t);
  }, []);
  return text;
}

      await sleep(14);

          ))}
        </div>
        <pre className="flex-1 overflow-auto scroll py-3 font-mono text-[12.5px] leading-6 bg-[#090a10]">
          {current ? current.content.split('\n').map((ln, k) => (
            <div key={k} className="code-line flex">
              <span className="select-none w-10 shrink-0 text-right pr-4 text-slate-600">{k + 1}</span>
              <span className="whitespace-pre pr-4" dangerouslySetInnerHTML={{ __html: highlight(ln, current.lang) || ' ' }} />
            </div>
          )) : <div className="px-4 text-slate-500">Dosyalar oluşturuluyor...</div>}
        </pre>
        <div className="h-28 border-t border-line bg-[#07080c] font-mono text-[12px] p-3 overflow-auto scroll text-slate-400">
          <div className="flex items-center gap-2 text-slate-500 mb-1"><Icon n="terminal" className="w-3.5 h-3.5" />Terminal</div>
          {logs.map((l, k) => <div key={k} className={l.startsWith('✓') ? 'text-emerald-400/90' : l.startsWith('➜') ? 'text-neo-400' : ''}>{l}</div>)}
        </div>
      </div>
    </div>
  );

  const Preview = (
    <div className="h-full flex flex-col min-h-0">
      <div className="flex items-center gap-2 px-3 h-11 border-b border-line">
        <div className="flex gap-1.5"><span className="w-3 h-3 rounded-full bg-[#ff5f57]" /><span className="w-3 h-3 rounded-full bg-[#febc2e]" /><span className="w-3 h-3 rounded-full bg-[#28c840]" /></div>
        <div className="flex-1 mx-2 h-7 rounded-md bg-white/5 text-xs text-slate-400 flex items-center px-3 font-mono truncate">localhost:5173</div>
        <button onClick={() => setPreview((p) => p + ' ')} className="w-8 h-8 grid place-items-center rounded-md hover:bg-white/5" title="Yenile"><Icon n="refresh" className="w-4 h-4" /></button>
        <button onClick={download} disabled={!files.length} className="w-8 h-8 grid place-items-center rounded-md hover:bg-white/5 disabled:opacity-40" title="İndir"><Icon n="download" className="w-4 h-4" /></button>
      </div>
      <div className="flex-1 bg-white/[.02] relative">
        {preview ? (
          <iframe title="Önizleme" srcDoc={preview} sandbox="allow-scripts allow-forms allow-modals" className="absolute inset-0 w-full h-full bg-[#07080d]" />
        ) : (
          <div className="absolute inset-0 grid place-items-center text-center">
            <div>
              <div className="w-14 h-14 mx-auto rounded-2xl border-2 border-neo-400 border-t-transparent animate-spin" />
              <p className="mt-4 text-sm shimmer animate-shimmer">Önizleme hazırlanıyor...</p>
            </div>
          </div>
        )}
      </div>
    </div>
  );

  return (
    <div className="h-[calc(100dvh-4rem)] flex flex-col">
      {/* Masaüstü: sohbet | kod/önizleme */}
      <div className="hidden lg:flex flex-1 min-h-0">
        <section className="w-[400px] border-r border-line glass">{Chat}</section>
        <section className="flex-1 min-w-0 flex flex-col bg-panel/90">
          <div className="flex items-center gap-1 p-2 border-b border-line">
            {[['code', 'Kod'], ['preview', 'Önizleme']].map(([k, t]) => (
              <button key={k} onClick={() => setTab(k)} className={`flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm ${tab === k ? 'bg-white/10 text-white' : 'text-slate-400 hover:text-white'}`}>
                <Icon n={k === 'code' ? 'code' : 'eye'} className="w-4 h-4" />{t}
              </button>
            ))}
          </div>
          <div className="flex-1 min-h-0">{tab === 'code' ? Code : Preview}</div>
        </section>
      </div>
      {/* Mobil: sekmeler */}
      <div className="lg:hidden flex-1 min-h-0 flex flex-col">
        <div className="flex-1 min-h-0 bg-panel/90">{mobileTab === 'chat' ? Chat : mobileTab === 'code' ? Code : Preview}</div>
        <nav className="grid grid-cols-3 border-t border-line glass pb-[env(safe-area-inset-bottom)]">
          {[['chat', 'chat', 'Sohbet'], ['code', 'code', 'Kod'], ['preview', 'eye', 'Önizleme']].map(([k, n, t]) => (
            <button key={k} onClick={() => setMobileTab(k)} className={`flex flex-col items-center gap-1 py-2.5 text-xs ${mobileTab === k ? 'text-neo-400' : 'text-slate-400'}`}>
              <Icon n={n} />{t}
            </button>
          ))}
        </nav>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------
   Uygulama
---------------------------------------------------------------- */
function App() {
  const [job, setJob] = useState(null);
  const [title, setTitle] = useState('');
  const home = () => { setJob(null); setTitle(''); };
  return (
    <>
      <NeoScene calm={!!job} />
      <TopBar onHome={home} inWorkspace={!!job} title={title} />
      {job ? <Workspace key={job.id} prompt={job.prompt} mode={job.mode} onTitle={setTitle} />
           : <Home onStart={(prompt, mode) => setJob({ prompt, mode, id: Date.now() })} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
