<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neo Thinking Orbs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070707;color:#fbfbfb;font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1080px;margin:0 auto;padding:64px 16px 120px}

.hero{min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.hint{font-size:12.5px;color:rgba(251,251,251,.28)}

.pill{display:inline-flex;align-items:center;gap:12px;height:74px;border-radius:999px;padding:0 32px 0 9px;
  background:rgba(29,29,29,.42);box-shadow:inset 0 0 0 1px rgba(44,47,54,.31),inset 0 0 50px 0 rgba(255,255,255,.012);
  transition:box-shadow .4s,background .4s}
.pill:hover{background:rgba(34,34,34,.5);box-shadow:inset 0 0 0 1px rgba(64,67,76,.45),inset 0 0 50px 0 rgba(255,255,255,.02)}
.pill canvas{width:56px;height:56px;flex:none;display:block}
.pill .lbl{position:relative;white-space:nowrap;font-size:18px;line-height:24px;
  background:linear-gradient(90deg,rgba(251,251,251,.45) 0%,rgba(251,251,251,.45) 40%,rgba(251,251,251,.85) 50%,rgba(251,251,251,.45) 60%,rgba(251,251,251,.45) 100%);
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 3.2s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-200% 0}}
.lbl.swap{transition:opacity .28s,filter .28s,transform .4s cubic-bezier(.22,1,.36,1)}
.lbl.out{opacity:0;filter:blur(4px);transform:translateY(-5px)}
.hero .pill{cursor:pointer;min-width:260px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:1px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.05);border-radius:20px;overflow:hidden}
.cell{background:#070707;min-height:190px;display:flex;align-items:center;justify-content:center;padding:24px 12px;position:relative}
.cell .no{position:absolute;left:14px;top:12px;font-size:11px;color:rgba(251,251,251,.2);font-variant-numeric:tabular-nums}

.inline{margin-top:48px;display:flex;flex-direction:column;gap:14px;align-items:flex-start;padding:0 8px}
.inline p{display:flex;align-items:center;gap:8px;font-size:15px;color:rgba(251,251,251,.5)}
.inline canvas{width:20px;height:20px;flex:none}

@media (max-width:420px){.pill{height:64px;padding-right:24px}.pill canvas{width:48px;height:48px}.pill .lbl{font-size:16px}}
@media (prefers-reduced-motion:reduce){.pill .lbl{animation:none}}
</style>
</head>
<body>
<main>
  <section class="hero">
    <div class="pill" id="hero" role="button" tabindex="0" aria-label="Düşünme durumu, bitirmek için tıkla">
      <canvas id="heroCv"></canvas><span class="lbl swap" id="heroTxt">Thinking….</span>
    </div>
    <p class="hint">noktalar bir durumdan ötekine akar · tıkla, bitsin</p>
  </section>

  <div class="grid" id="grid"></div>
  <div class="inline" id="inline"></div>
</main>

<script>
/* ═══════════════════════════════════════════════════════════
   Noktalı düşünme orb'ları — bu sayfa için sıfırdan yazıldı.
   Her durum 3D (bazısı 4D) bir nokta bulutu üretir; bulut
   döndürülür, dik izdüşümle çizilir, arkadan öne sıralanır ve
   derinliğe göre gri tonlanır. Üstteki hap, noktaları bir
   durumdan diğerine akıtarak dönüştürür.
   ═══════════════════════════════════════════════════════════ */
const TAU = Math.PI*2;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v,a=0,b=1) => Math.max(a,Math.min(b,v));
const lerp = (a,b,t) => a+(b-a)*t;
const ease = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
const tri = x => 1-Math.abs((x%2+2)%2-1);
function fib(n,r=1){ const p=[], g=Math.PI*(3-Math.sqrt(5)); for(let i=0;i<n;i++){ const y=1-2*(i+.5)/n, q=Math.sqrt(1-y*y), a=g*i; p.push([Math.cos(a)*q*r,y*r,Math.sin(a)*q*r]); } return p; }
const rY=([x,y,z,...m],a)=>{ const c=Math.cos(a),s=Math.sin(a); return [x*c-z*s,y,x*s+z*c,...m]; };
const rX=([x,y,z,...m],a)=>{ const c=Math.cos(a),s=Math.sin(a); return [x,y*c-z*s,y*s+z*c,...m]; };
const rZ=([x,y,z,...m],a)=>{ const c=Math.cos(a),s=Math.sin(a); return [x*c-y*s,x*s+y*c,z,...m]; };
const hash = i => { const s=Math.sin(i*127.1)*43758.5453; return s-Math.floor(s); };

/* ── durumlar: kurulum → (t, dt) => [[x,y,z,parıltı?], ...] ── */
const STATES = {
  working: () => (t) => { const P=[]; for(let o=0;o<3;o++){ const tilt=[.35,-.9,1.4][o], spin=o*TAU/3; for(let i=0;i<44;i++){ const a=i/44*TAU+t*(.9+o*.25); P.push(rY(rX([Math.cos(a)*.95,0,Math.sin(a)*.95],tilt),spin)); } } for(const p of fib(26,.22)) P.push(p); return P; },
  searching: () => { const S=fib(260); return (t) => { const sw=(t*1.3)%TAU; return S.map(p=>{ const q=rY(p,t*.35); const lon=Math.atan2(q[0],q[2]); const d=Math.abs(((lon-sw+Math.PI)%TAU+TAU)%TAU-Math.PI); return [...q.slice(0,3), Math.exp(-d*d*14)]; }); }; },
  solving: () => { const B=[]; for(let b=0;b<7;b++){ const y=-.84+b*.28, r=Math.sqrt(1-y*y), n=Math.round(r*34); const row=[]; for(let i=0;i<n;i++) row.push([Math.cos(i/n*TAU)*r,y,Math.sin(i/n*TAU)*r]); B.push(row); } const off=[1.9,-2.6,1.2,-.8,2.4,-1.7,.9]; return (t) => { const cyc=(t*.35)%1, k=cyc<.55?ease(clamp(cyc/.55)):1-ease(clamp((cyc-.7)/.3)); const P=[]; B.forEach((row,b)=>{ const a=off[b]*(1-k)+t*.25; for(const p of row) P.push([...rX(rY(p,a),.35), k>.98?.6:0]); }); return P; }; },
  listening: () => (t) => { const P=[]; for(let r=1;r<=7;r++){ const R=r/7*.98, n=r*9; for(let i=0;i<n;i++){ const a=i/n*TAU; const y=.2*Math.sin(R*7-t*4)*Math.cos(a*2+t); P.push(rX([Math.cos(a)*R,y,Math.sin(a)*R],.95)); } } return P; },
  composing: () => { const N=240, S=[]; for(let i=0;i<N;i++){ const u=i/N, y=1-2*u, r=Math.sqrt(1-y*y), a=u*TAU*9; S.push([Math.cos(a)*r,y,Math.sin(a)*r]); } return (t) => { const head=((t*.22)%1.3)*N; const P=[]; S.forEach((p,i)=>{ const d=head-i; if(d<0) return; P.push([...rX(rY(p,t*.5),.3), d<14?1-d/14:0]); }); return P; }; },
  shaping: () => (t) => { const sh=[64,3,4], ph=(t*.4)%3, si=Math.floor(ph), k=ease(clamp((ph-si)*1.5-.25)); const A=sh[si], Bn=sh[(si+1)%3]; const poly=(n,u)=>{ const s=u*n, e=Math.floor(s), f=s-e; const a1=e/n*TAU-Math.PI/2, a2=(e+1)/n*TAU-Math.PI/2; return [lerp(Math.cos(a1),Math.cos(a2),f),lerp(Math.sin(a1),Math.sin(a2),f)]; }; const P=[]; for(let l=0;l<3;l++) for(let i=0;i<60;i++){ const u=i/60; const [x1,y1]=poly(A,u),[x2,y2]=poly(Bn,u); const s=.95-l*.09; P.push(rX(rY([lerp(x1,x2,k)*s,lerp(y1,y2,k)*s,(l-1)*.18],Math.sin(t*.6)*.5),.25)); } return P; },

  // 4 boyutlu hiperküp, iki düzlemde birden döner
  dreaming: () => { const V=[]; for(let i=0;i<16;i++) V.push([i&1?1:-1,i&2?1:-1,i&4?1:-1,i&8?1:-1]); const E=[]; for(let a=0;a<16;a++) for(let b=a+1;b<16;b++){ const d=a^b; if(d&&!(d&(d-1))) E.push([a,b]); } return (t) => { const a=t*.5, b=t*.33; const pj=v=>{ let [x,y,z,w]=v; [x,w]=[x*Math.cos(a)-w*Math.sin(a),x*Math.sin(a)+w*Math.cos(a)]; [y,z]=[y*Math.cos(b)-z*Math.sin(b),y*Math.sin(b)+z*Math.cos(b)]; const f=1/(2.6-w); return [x*f*1.35,y*f*1.35,z*f*1.35,(w+1)/2]; }; const Q=V.map(pj), P=[]; E.forEach(([i,j])=>{ for(let k=0;k<=6;k++){ const u=k/6; P.push(rX(rY([lerp(Q[i][0],Q[j][0],u),lerp(Q[i][1],Q[j][1],u),lerp(Q[i][2],Q[j][2],u),k===0||k===6?.5:0],.3),.2)); } }); return P; }; },
  // açıp kapanan çiçek
  imagining: () => (t) => { const open=.5+.5*Math.sin(t*1.1), P=[]; for(let l=0;l<3;l++){ const k=[5,5,3][l], s=[.95,.68,.4][l], off=l*.35+t*.2; for(let i=0;i<90;i++){ const a=i/90*TAU; const r=Math.abs(Math.cos(k*a/2))*s; const z=(r*r)*(.9*open-.2)*(l?-1:1); P.push(rX([Math.cos(a+off)*r,Math.sin(a+off)*r,z,r>s*.95?.4:0],-.5+Math.sin(t*.4)*.15)); } } return P; },
  // üç katmanlı sinir ağı; sinyaller kenarlardan akar
  connecting: () => { const L=[4,5,4], N=[]; L.forEach((n,l)=>{ for(let i=0;i<n;i++){ const a=i/n*TAU+l*.4; N.push([(l-1)*.85,Math.cos(a)*.55,Math.sin(a)*.55,l]); } }); const E=[]; N.forEach((a,i)=>N.forEach((b,j)=>{ if(b[3]===a[3]+1) E.push([i,j]); })); return (t) => { const P=[]; N.forEach(n=>{ for(const q of fib(10,.07)) P.push([n[0]+q[0],n[1]+q[1],n[2]+q[2],0]); }); E.forEach(([i,j],k)=>{ const A=N[i],B=N[j]; for(let s=1;s<5;s++){ const u=s/5; P.push([lerp(A[0],B[0],u),lerp(A[1],B[1],u),lerp(A[2],B[2],u),0,.5]); } const u=((t*.6+hash(k))%1.6)/1.6; if(u<1) P.push([lerp(A[0],B[0],u),lerp(A[1],B[1],u),lerp(A[2],B[2],u),1,1.4]); }); return P.map(p=>rX(rY(p,t*.4),.25)); }; },
  // sarkaç dalgası: farklı periyotlar desen oluşturur
  deliberating: () => (t) => { const P=[]; for(let i=0;i<15;i++){ const w=1.4*(1+i*.055), th=.75*Math.sin(t*w), z=-.84+i*.12; for(let s=1;s<=3;s++){ const L=s/4*1.2; P.push([Math.sin(th)*L,.62-Math.cos(th)*L,z,0,.45]); } for(const q of fib(7,.06)) P.push([Math.sin(th)*1.2+q[0],.62-Math.cos(th)*1.2+q[1],z+q[2],0]); } return P.map(p=>rX(rY([p[0]*1.1,p[1]*1.1,p[2]*1.1,...p.slice(3)],.5),.3)); },
  // halkalı gezegen
  researching: () => { const S=fib(120,.46), R=[]; for(let r=0;r<4;r++){ const rr=.64+r*.1, n=Math.round(rr*52); for(let i=0;i<n;i++) R.push([rr,i/n*TAU]); } return (t) => { const P=S.map(p=>rY(p,t*.6)); for(const [rr,a] of R) P.push([Math.cos(a+t*.3/rr)*rr,0,Math.sin(a+t*.3/rr)*rr,rr>.9?.3:0]); return P.map(p=>rX(rZ(p,.35),.42)); }; },
  // kara delik: dönen yığılma diski + foton halkası, ortası boş
  focusing: () => { const D=[]; for(let i=0;i<220;i++) D.push([.42+Math.pow(hash(i),.7)*.55, hash(i+99)*TAU]); return (t) => { const P=[]; for(const [r,a0] of D){ const a=a0+t*.55/Math.pow(r,1.5); P.push(rX([Math.cos(a)*r,0,Math.sin(a)*r,r<.5?.8:0],1.28)); } for(let i=0;i<60;i++){ const a=i/60*TAU; P.push([Math.cos(a)*.34,Math.sin(a)*.34,.9,.9,.8]); } for(let i=0;i<40;i++){ const a=Math.PI*(.08+.84*i/39); P.push([Math.cos(a)*.6,Math.sin(a)*.42+.05,-.2,0,.8]); } return P; }; },
  // sürü halinde uçan parçacıklar (basit boids)
  exploring: () => { const B=Array.from({length:70},(_,i)=>({p:fib(70,.6)[i],v:[hash(i)-.5,hash(i+7)-.5,hash(i+13)-.5].map(v=>v*.02)})); let last=0; return (t) => { const steps=Math.min(4,Math.max(1,Math.round((t-last)*60))); last=t; for(let s=0;s<steps;s++){ const T=[Math.cos(t*.7)*.75,Math.sin(t*1.1)*.55,Math.sin(t*.7)*.75]; for(const b of B){ let ax=(T[0]-b.p[0])*.0009, ay=(T[1]-b.p[1])*.0009, az=(T[2]-b.p[2])*.0009; for(const o of B){ if(o===b) continue; const dx=b.p[0]-o.p[0],dy=b.p[1]-o.p[1],dz=b.p[2]-o.p[2],d2=dx*dx+dy*dy+dz*dz; if(d2<.03){ ax+=dx*.006; ay+=dy*.006; az+=dz*.006; } else if(d2<.06){ ax+=(o.v[0]-b.v[0])*.01; ay+=(o.v[1]-b.v[1])*.01; az+=(o.v[2]-b.v[2])*.01; } } b.v=[b.v[0]+ax,b.v[1]+ay,b.v[2]+az]; const sp=Math.hypot(...b.v), m=clamp(sp,.006,.018)/(sp||1); b.v=b.v.map(v=>v*m); b.p=b.p.map((v,k)=>clamp(v+b.v[k],-.95,.95)); } } return B.map(b=>[...b.p]); }; },
  // (3,5) simit düğümü
  remembering: () => { const P=[]; for(let i=0;i<260;i++){ const u=i/260*TAU, r=Math.cos(5*u)+2.2; P.push([r*Math.cos(3*u)/3.3,r*Math.sin(3*u)/3.3,-Math.sin(5*u)/3.3*1.3]); } return (t) => P.map(p=>rX(rY(p,t*.45),.9+Math.sin(t*.3)*.3)); },
  // iki küre arasında parçacık alışverişi
  translating: () => { const A=fib(60,.3); return (t) => { const P=[]; for(const q of A){ const A1=rY(q,t), B1=rY(q,-t); P.push([A1[0]-.58,A1[1],A1[2]],[B1[0]+.58,B1[1],B1[2]]); } for(let i=0;i<34;i++){ const dir=i%2?1:-1, u=(t*.45+hash(i))%1, x=lerp(-.58,.58,dir>0?u:1-u), y=Math.sin(u*Math.PI)*.42*(i%4<2?1:-1), z=(hash(i+3)-.5)*.3; P.push([x,y,z,Math.sin(u*Math.PI)]); } return P.map(p=>rX(p,.3)); }; },
  // iç içe jiroskop halkaları
  weighing: () => (t) => { const P=[]; [[.95,[t*.7,0]],[.78,[0,t*1.1]],[.61,[t*1.4,t*.8]]].forEach(([r,[ax,ay]],k)=>{ const n=Math.round(r*58); for(let i=0;i<n;i++){ const a=i/n*TAU; P.push(rY(rX([Math.cos(a)*r,Math.sin(a)*r,0,i===0?1:0],ax+k),ay)); } }); for(const q of fib(18,.14)) P.push(q); return P.map(p=>rX(p,.25)); },
  // dağınık parçacıklar kürede toplanır, sonra dağılır
  assembling: () => { const S=fib(200), F=S.map((_,i)=>{ const a=hash(i)*TAU, b=Math.acos(2*hash(i+5)-1); return [Math.sin(b)*Math.cos(a)*1.9,Math.cos(b)*1.9,Math.sin(b)*Math.sin(a)*1.9]; }); return (t) => { const cyc=(t*.28)%1; return S.map((p,i)=>{ const st=hash(i+11)*.3; const k=cyc<.6?ease(clamp((cyc-st)/.3)):1-ease(clamp((cyc-.8)/.2)); const q=[lerp(F[i][0],p[0],k),lerp(F[i][1],p[1],k),lerp(F[i][2],p[2],k)]; return [...rX(rY(q,t*.4),.3), k>.97&&k<1?.3:0]; }); }; },
  summarizing: () => { const S=fib(220); return (t) => { const k=ease(tri(t*.35)); return S.map(([x,y,z])=>{ const a=Math.atan2(z,x); return rX(rY([lerp(x,Math.cos(a)*.9,k),lerp(y,y*.08,k),lerp(z,Math.sin(a)*.9,k)],t*.5),.55); }); }; },

  // "bitti": noktalar bir tik işaretine akar
  done: () => { const P=[], path=[[-.45,.02],[-.12,-.32],[.5,.34]]; for(let i=0;i<70;i++){ const u=i/69, seg=u<.35?0:1, v=seg?(u-.35)/.65:u/.35; P.push([lerp(path[seg][0],path[seg+1][0],v),lerp(path[seg][1],path[seg+1][1],v),0,.6]); } for(let i=0;i<90;i++){ const a=i/90*TAU; P.push([Math.cos(a)*.95,Math.sin(a)*.95,0,0,.7]); } return () => P; },
};

/* ── çizici ── */
const PRESET = { 64:{scale:.9, dot:1.5, min:.35}, 20:{scale:.92, dot:.75, min:.3} };
function painter(cv, size){
  const ctx = cv.getContext('2d'), pr = PRESET[size];
  const W = cv.clientWidth || size, dpr = Math.min(devicePixelRatio||1, 2);
  cv.width = cv.height = W*dpr;
  const R = W/2*pr.scale, k = W/size;
  return (P, tilt=[0,0], zoom=1) => {
    const Q = P.map(p => rX(rY(p, tilt[0]), tilt[1])).sort((a,b) => a[2]-b[2]);
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,W);
    for(const [x,y,z,glow=0,sz=1] of Q){
      const d = clamp((z+1)/2), g = Math.round(lerp(70,238,d) + glow*17);
      ctx.fillStyle = `rgba(${g},${g},${g+2},${lerp(pr.min,1,d)})`;
      ctx.beginPath(); ctx.arc(W/2 + x*R*zoom, W/2 - y*R*zoom, pr.dot*k*(.55+.6*d)*(1+glow*.6)*sz, 0, TAU); ctx.fill();
    }
  };
}

/* ── üzerine gelince hızlanır ve imlece doğru eğilir ── */
function interactive(el){
  const s = {speed:1, target:1, tilt:[0,0], tt:[0,0], zoom:1, tz:1};
  el.addEventListener('pointermove', e => { const r = el.getBoundingClientRect(); s.tt = [((e.clientX-r.left)/r.width-.5)*.9, ((e.clientY-r.top)/r.height-.5)*.9]; s.target = 2.4; s.tz = 1.07; });
  el.addEventListener('pointerleave', () => { s.tt = [0,0]; s.target = 1; s.tz = 1; });
  s.step = dt => { s.speed = lerp(s.speed,s.target,.06); s.zoom = lerp(s.zoom,s.tz,.1); s.tilt = s.tilt.map((v,i) => lerp(v,s.tt[i],.08)); return dt*s.speed; };
  return s;
}

/* ── ızgara ── */
const LABELS = {
  working:'Working…', searching:'Searching…', solving:'Solving…', listening:'Listening…', composing:'Composing…', shaping:'Shaping…',
  dreaming:'Dreaming in 4D…', imagining:'Imagining…', connecting:'Connecting ideas…', deliberating:'Deliberating…', researching:'Researching…', focusing:'Focusing…',
  exploring:'Exploring…', remembering:'Remembering…', translating:'Translating…', weighing:'Weighing options…', assembling:'Assembling…', summarizing:'Summarizing…'
};
const orbs = [];
const grid = document.getElementById('grid');
Object.entries(LABELS).forEach(([st,lbl],i) => {
  const c = document.createElement('div'); c.className = 'cell';
  c.innerHTML = `<span class="no">${String(i+1).padStart(2,'0')}</span><div class="pill"><canvas></canvas><span class="lbl"></span></div>`;
  c.querySelector('.lbl').textContent = lbl; grid.append(c);
  const cv = c.querySelector('canvas');
  orbs.push({ cv, gen: STATES[st](), paint: painter(cv,64), ctl: interactive(c.querySelector('.pill')), t: hash(i)*20, vis: true });
});
const inline = document.getElementById('inline');
[['dreaming','Neo is dreaming up an answer'],['searching','Searching 12 sources'],['focusing','Focusing on the hard part'],['translating','Translating to Turkish']].forEach(([st,txt],i) => {
  const p = document.createElement('p'); p.innerHTML = '<canvas></canvas><span></span>'; p.querySelector('span').textContent = txt; inline.append(p);
  const cv = p.querySelector('canvas');
  orbs.push({ cv, gen: STATES[st](), paint: painter(cv,20), ctl: interactive(p), t: i*3, vis: true });
});
const io = new IntersectionObserver(es => es.forEach(e => { const o = orbs.find(o => o.cv === e.target); if(o) o.vis = e.isIntersecting; }));
orbs.forEach(o => io.observe(o.cv));

/* ── üstteki hap: noktalar durumlar arasında akar ── */
const HERO_FLOW = [['composing','Thinking….'],['searching','Searching the web…'],['connecting','Connecting ideas…'],['dreaming','Dreaming in 4D…'],['summarizing','Summarizing…'],['focusing','Almost there…']];
const HN = 230;
const resample = P => Array.from({length:HN}, (_,i) => P.length ? P[Math.floor(i*P.length/HN)] : [0,0,0]);
const heroCv = document.getElementById('heroCv'), heroTxt = document.getElementById('heroTxt'), heroEl = document.getElementById('hero');
const hero = { paint: painter(heroCv,64), ctl: interactive(heroEl), t: 0, idx: 0, from: null, to: STATES[HERO_FLOW[0][0]](), k: 1, done: false, nextAt: 3 };
function heroGo(gen, label){
  hero.from = hero.cur; hero.to = gen; hero.k = 0;
  heroTxt.classList.add('out'); setTimeout(() => { heroTxt.textContent = label; heroTxt.classList.remove('out'); }, 280);
}
function finish(){
  if(hero.done) return; hero.done = true; heroGo(STATES.done(), 'Done.');
  setTimeout(() => { hero.done = false; hero.idx = 0; heroGo(STATES[HERO_FLOW[0][0]](), HERO_FLOW[0][1]); hero.nextAt = hero.t + 3; }, 2600);
}
heroEl.addEventListener('click', finish);
heroEl.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); finish(); } });

/* ── tek döngü ── */
let last = performance.now();
function frame(now){
  const dt = Math.min(.05,(now-last)/1000); last = now;
  // hap
  hero.t += hero.ctl.step(dt);
  if(!hero.done && hero.t > hero.nextAt){ hero.idx = (hero.idx+1) % HERO_FLOW.length; heroGo(STATES[HERO_FLOW[hero.idx][0]](), HERO_FLOW[hero.idx][1]); hero.nextAt = hero.t + 3.2; }
  hero.k = Math.min(1, hero.k + dt/.9);
  const B = resample(hero.to(hero.t));
  let P = B;
  if(hero.from && hero.k < 1){
    const A = resample(hero.from(hero.t)), e = ease(hero.k);
    P = B.map((b,i) => { const a = A[i], w = clamp(e*1.25 - hash(i)*.25), lift = Math.sin(w*Math.PI)*.18; return [lerp(a[0],b[0],w)*(1+lift), lerp(a[1],b[1],w)*(1+lift), lerp(a[2],b[2],w), lerp(a[3]||0,b[3]||0,w), lerp(a[4]||1,b[4]||1,w)]; });
  }
  hero.cur = () => P;
  hero.paint(P, hero.ctl.tilt, hero.ctl.zoom);
  // ızgara
  for(const o of orbs){ o.t += o.ctl.step(dt); if(o.vis) o.paint(o.gen(o.t), o.ctl.tilt, o.ctl.zoom); }
  if(!REDUCED) requestAnimationFrame(frame);
}
hero.cur = () => resample(hero.to(0));
requestAnimationFrame(frame);
</script>
</body>
</html>
