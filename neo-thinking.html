<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neo Thinking Orbs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070707;color:#fbfbfb;font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1080px;margin:0 auto;padding:72px 16px 120px}

/* ana sahne: tek hap */
.hero{min-height:360px;display:flex;align-items:center;justify-content:center}

/* hap — koyu cam, ince iç kenar */
.pill{display:inline-flex;align-items:center;gap:12px;height:74px;border-radius:999px;padding:0 32px 0 9px;
  background:rgba(29,29,29,.42);box-shadow:inset 0 0 0 1px rgba(44,47,54,.31),inset 0 0 50px 0 rgba(255,255,255,.012)}
.pill canvas{width:56px;height:56px;flex:none;display:block}
.pill span{white-space:nowrap;font-size:18px;line-height:24px;color:rgba(251,251,251,.5)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:1px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.05);border-radius:20px;overflow:hidden}
.cell{background:#070707;min-height:190px;display:flex;align-items:center;justify-content:center;padding:24px 12px}

/* 20px satır içi */
.inline{margin-top:48px;display:flex;flex-direction:column;gap:14px;align-items:flex-start;padding:0 8px}
.inline p{display:flex;align-items:center;gap:8px;font-size:15px;color:rgba(251,251,251,.5)}
.inline canvas{width:20px;height:20px;flex:none}

@media (max-width:420px){.pill{height:64px;padding-right:24px}.pill canvas{width:48px;height:48px}.pill span{font-size:16px}}
</style>
</head>
<body>
<main>
  <section class="hero">
    <div class="pill"><canvas data-state="composing" data-size="64"></canvas><span id="heroTxt">Thinking….</span></div>
  </section>

  <div class="grid" id="grid"></div>

  <div class="inline" id="inline"></div>
</main>

<script>
/* ═══════════════════════════════════════════════════════════
   Noktalı düşünme orb'ları — bu sayfa için sıfırdan yazıldı.
   Her durum 3D bir nokta bulutu üretir; nokta bulutu döndürülür,
   dik (ortografik) izdüşümle çizilir, arkadan öne sıralanır ve
   derinliğe göre gri tonlarda boyanır.
   ═══════════════════════════════════════════════════════════ */
const TAU = Math.PI*2;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v,a=0,b=1) => Math.max(a,Math.min(b,v));
const lerp = (a,b,t) => a+(b-a)*t;
const ease = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
const tri = x => 1-Math.abs((x%2+2)%2-1);
function fib(n){ const p=[], g=Math.PI*(3-Math.sqrt(5)); for(let i=0;i<n;i++){ const y=1-2*(i+.5)/n, r=Math.sqrt(1-y*y), a=g*i; p.push([Math.cos(a)*r,y,Math.sin(a)*r]); } return p; }
function rotY([x,y,z],a){ const c=Math.cos(a), s=Math.sin(a); return [x*c-z*s,y,x*s+z*c]; }
function rotX([x,y,z],a){ const c=Math.cos(a), s=Math.sin(a); return [x,y*c-z*s,y*s+z*c]; }
function rotZ([x,y,z],a){ const c=Math.cos(a), s=Math.sin(a); return [x*c-y*s,x*s+y*c,z]; }

/* Her durum: kurulum → (t) => [[x,y,z,parlaklık?], ...]  (birim küre içinde) */
const STATES = {
  // yörüngelerde dönen parçacıklar
  working: () => (t) => { const P=[]; for(let o=0;o<3;o++){ const tilt=[.35,-.9,1.4][o], spin=o*TAU/3; for(let i=0;i<44;i++){ const a=i/44*TAU+t*(.9+o*.25); let p=[Math.cos(a)*.95,0,Math.sin(a)*.95]; p=rotX(p,tilt); p=rotY(p,spin); P.push(p); } } for(const p of fib(26)) P.push(p.map(v=>v*.22)); return P; },
  // noktalı küre, üstünden tarayan meridyen
  searching: () => { const S=fib(260); return (t) => { const sw=(t*1.3)%TAU; return S.map(p=>{ const q=rotY(p,t*.35); const lon=Math.atan2(q[0],q[2]); let d=Math.abs(((lon-sw+Math.PI)%TAU+TAU)%TAU-Math.PI); return [...q, Math.exp(-d*d*14)]; }); }; },
  // bantlar karışır, sonra "tık" diye çözülür
  solving: () => { const B=[]; for(let b=0;b<7;b++){ const y=-.84+b*.28, r=Math.sqrt(1-y*y), n=Math.round(r*34); const row=[]; for(let i=0;i<n;i++) row.push([Math.cos(i/n*TAU)*r,y,Math.sin(i/n*TAU)*r]); B.push(row); } const off=[1.9,-2.6,1.2,-.8,2.4,-1.7,.9]; return (t) => { const cyc=(t*.35)%1, k=cyc<.55?ease(clamp(cyc/.55)):1-ease(clamp((cyc-.7)/.3)); const P=[]; B.forEach((row,b)=>{ const a=off[b]*(1-k)+t*.25; for(const p of row) P.push(rotX(rotY(p,a),.35)); }); return P; }; },
  // halkalar boyunca yuvarlanan dalga
  listening: () => (t) => { const P=[]; for(let r=1;r<=7;r++){ const R=r/7*.98, n=r*9; for(let i=0;i<n;i++){ const a=i/n*TAU; const y=.2*Math.sin(R*7-t*4)*Math.cos(a*2+t); P.push(rotX([Math.cos(a)*R,y,Math.sin(a)*R],.95)); } } return P; },
  // kalem küreyi sarmal çizerek doldurur
  composing: () => { const N=240, S=[]; for(let i=0;i<N;i++){ const u=i/N, y=1-2*u, r=Math.sqrt(1-y*y), a=u*TAU*9; S.push([Math.cos(a)*r,y,Math.sin(a)*r]); } return (t) => { const head=((t*.22)%1.3)*N; const P=[]; S.forEach((p,i)=>{ const q=rotX(rotY(p,t*.5),.3); const d=head-i; if(d<0) return; P.push([...q, d<14?1-d/14:0]); }); return P; }; },
  // çember → üçgen → kare
  shaping: () => (t) => { const sh=[64,3,4], ph=(t*.4)%3, si=Math.floor(ph), k=ease(clamp((ph-si)*1.5-.25)); const A=sh[si], Bn=sh[(si+1)%3]; const poly=(n,u)=>{ const s=u*n, e=Math.floor(s), f=s-e; const a1=e/n*TAU-Math.PI/2, a2=(e+1)/n*TAU-Math.PI/2; return [lerp(Math.cos(a1),Math.cos(a2),f),lerp(Math.sin(a1),Math.sin(a2),f)]; }; const P=[]; for(let l=0;l<3;l++) for(let i=0;i<60;i++){ const u=i/60; const [x1,y1]=poly(A,u),[x2,y2]=poly(Bn,u); const s=.95-l*.09; P.push(rotX(rotY([lerp(x1,x2,k)*s,lerp(y1,y2,k)*s,(l-1)*.18],Math.sin(t*.6)*.5),.25)); } return P; },
  // dönen silindirde satırlar
  reading: () => (t) => { const P=[]; for(let r=0;r<9;r++){ const y=-.8+r*.2; const n=30; for(let i=0;i<n;i++){ const a=i/n*TAU+t*.6; const len=(Math.sin(r*3.7+i*.9)+1)/2; if(len<.25) continue; P.push(rotX([Math.cos(a)*.78,y,Math.sin(a)*.78],.2)); } } return P; },
  // dolanan çift sarmal
  planning: () => (t) => { const P=[]; for(let s=0;s<2;s++) for(let i=0;i<90;i++){ const u=i/90, y=-.95+u*1.9, a=u*TAU*2.5+s*Math.PI+t*1.1, r=Math.sqrt(1-y*y)*.9; P.push(rotX([Math.cos(a)*r,y,Math.sin(a)*r],.3)); } return P; },
  // atımlı küp kafes
  coding: () => { const G=[]; for(let i=0;i<4;i++) for(let j=0;j<4;j++) for(let k=0;k<4;k++) G.push([(i-1.5)*.38,(j-1.5)*.38,(k-1.5)*.38,(i*7+j*13+k*5)%11]); return (t) => G.map(([x,y,z,h])=>{ const q=rotX(rotY([x,y,z],t*.6),t*.35+.4); return [...q, Math.max(0,Math.sin(t*3+h))**6]; }); },
  // iç içe nefes alan kabuklar
  remembering: () => { const L=[fib(150),fib(70),fib(24)]; return (t) => { const P=[]; L.forEach((S,k)=>{ const r=[.95,.62,.3][k]*(1+.08*Math.sin(t*2-k*1.3)); for(const p of S) P.push(rotX(rotY(p.map(v=>v*r),t*(k%2?-.6:.4)),.3)); }); return P; }; },
  // küre halkaya çöker, geri açılır
  summarizing: () => { const S=fib(220); return (t) => { const k=ease(tri(t*.35)); return S.map(([x,y,z])=>{ const a=Math.atan2(z,x); const tx=Math.cos(a)*.9, tz=Math.sin(a)*.9, ty=y*.08; return rotX(rotY([lerp(x,tx,k),lerp(y,ty,k),lerp(z,tz,k)],t*.5),.55); }); }; },
  // kovalayan ışıkla dolan halka
  verifying: () => (t) => { const P=[], N=48, h=(t*.5)%1; for(let l=0;l<3;l++) for(let i=0;i<N;i++){ const a=i/N*TAU; const u=i/N; const lit=u<h?1-(h-u)*2.5:0; P.push([...rotX([Math.cos(a)*(.95-l*.05),(l-1)*.1,Math.sin(a)*(.95-l*.05)],1.15), clamp(lit)]); } return P; },
};

/* boyut ayarları: 64 = sohbet avatarı, 20 = satır içi */
const PRESET = { 64:{scale:.9, dot:1.5, min:.35}, 20:{scale:.92, dot:.75, min:.3} };

function makeOrb(cv, state, size){
  const ctx = cv.getContext('2d'), gen = STATES[state](), pr = PRESET[size] || PRESET[64];
  const W = cv.clientWidth || size, dpr = Math.min(devicePixelRatio||1, 2);
  cv.width = cv.height = W*dpr;
  const R = W/2*pr.scale, k = W/size;
  return (t) => {
    const P = gen(t).map(p => p.slice()).sort((a,b) => a[2]-b[2]);
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,W);
    for(const [x,y,z,glow=0] of P){
      const d = (z+1)/2;                                  // 0 = arka, 1 = ön
      const g = Math.round(lerp(70, 238, d) + glow*17);    // gri ton
      const a = lerp(pr.min, 1, d);
      const r = pr.dot*k*(.55 + .6*d) * (1 + glow*.6);
      ctx.fillStyle = `rgba(${g},${g},${g+2},${a})`;
      ctx.beginPath(); ctx.arc(W/2 + x*R, W/2 - y*R, r, 0, TAU); ctx.fill();
    }
  };
}

/* ── sayfa ── */
const LABELS = {
  working:'Working…', searching:'Searching…', solving:'Solving…', listening:'Listening…', composing:'Composing…', shaping:'Shaping…',
  reading:'Reading…', planning:'Planning…', coding:'Coding…', remembering:'Remembering…', summarizing:'Summarizing…', verifying:'Verifying…'
};
const grid = document.getElementById('grid'), inline = document.getElementById('inline');
for(const [st,lbl] of Object.entries(LABELS)){
  const c = document.createElement('div'); c.className = 'cell';
  c.innerHTML = `<div class="pill"><canvas data-state="${st}" data-size="64"></canvas><span></span></div>`;
  c.querySelector('span').textContent = lbl; grid.append(c);
}
['working','searching','solving','composing'].forEach(st => {
  const p = document.createElement('p');
  p.innerHTML = `<canvas data-state="${st}" data-size="20"></canvas><span></span>`;
  p.querySelector('span').textContent = { working:'Neo is working on it', searching:'Searching 12 sources', solving:'Solving the equation', composing:'Writing your answer' }[st];
  inline.append(p);
});

const orbs = [...document.querySelectorAll('canvas[data-state]')].map(cv => ({ cv, draw: makeOrb(cv, cv.dataset.state, +cv.dataset.size), vis:true }));
const io = new IntersectionObserver(es => es.forEach(e => { const o = orbs.find(o => o.cv === e.target); if(o) o.vis = e.isIntersecting; }));
orbs.forEach(o => io.observe(o.cv));

const t0 = performance.now();
(function frame(now){
  const t = REDUCED ? 2 : (now - t0)/1000;
  for(const o of orbs) if(o.vis) o.draw(t);
  if(!REDUCED) requestAnimationFrame(frame);
})(t0);
</script>
</body>
</html>
