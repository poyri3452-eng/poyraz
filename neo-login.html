<style>
:root{
  --bg:#ffffff;
  --tx:#141210;--tx2:#6e675f;--tx3:#a39b91;
  --field:#f6f3ef;--field-f:#f3ebe2;--ln:#e8e2da;--ln2:#d8cfc4;
  --br:#8b5e3c;--br2:#b08462;
  --er:#c2410c;--ok:#3f7d4e;
  --e:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.i{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;overflow:visible}

.page{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;padding:16px}

/* ── form ── */
.side{display:flex;flex-direction:column;padding:10px 24px}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;color:var(--tx);text-decoration:none}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--tx);display:grid;place-items:center;color:#f3ebe2;font-style:normal;font-weight:700;font-size:13px}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:36px 0;position:relative}
form{width:100%;max-width:380px;transition:opacity .45s var(--e),transform .45s var(--e),filter .45s}
form.away{opacity:0;transform:translateY(-8px) scale(.985);filter:blur(4px);pointer-events:none}
h1{font-weight:400;font-size:clamp(34px,4vw,44px);letter-spacing:-.035em;line-height:1.05}
h1 .i{display:inline-block;width:.78em;height:.78em;margin-left:.22em;vertical-align:-.06em;stroke-width:1.4;color:var(--br)}
.lead{color:var(--tx2);font-size:14.5px;margin:10px 0 26px;line-height:1.5}

.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--field);border-radius:10px;padding:3px;margin-bottom:20px;position:relative}
.tabs button{appearance:none;border:0;background:none;padding:8px;font-size:13.5px;font-weight:500;color:var(--tx2);cursor:pointer;position:relative;z-index:1;transition:color .2s;display:flex;align-items:center;justify-content:center;gap:7px}
.tabs button[aria-selected="true"]{color:var(--tx)}
.tabs .pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:8px;background:#fff;box-shadow:0 1px 2px rgba(40,25,10,.08),0 0 0 1px var(--ln);transition:transform .4s var(--e)}
.tabs[data-mode="signup"] .pill{transform:translateX(100%)}

.sso{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbtn{appearance:none;border:1px solid var(--ln);background:#fff;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:9px;font-size:13.5px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.sbtn:hover{background:var(--field);border-color:var(--ln2)}
.sbtn:active{transform:scale(.98)}
.sbtn svg{width:17px;height:17px}
.or{display:flex;align-items:center;gap:12px;color:var(--tx3);font-size:12.5px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--ln)}
.or span{display:flex;align-items:center;gap:6px}
.or .i{width:13px;height:13px}

.field{margin-bottom:14px;position:relative}
label{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--tx2);margin-bottom:6px;transition:color .2s}
.field:focus-within label{color:var(--br)}
.inp{position:relative}
.inp input{width:100%;height:44px;border-radius:10px;border:1px solid transparent;background:var(--field);padding:0 42px 0 14px;font-size:14px;outline:none;transition:border-color .2s,background .2s,box-shadow .2s}
.inp input::placeholder{color:var(--tx3)}
.inp input:focus{background:var(--field-f);border-color:rgba(139,94,60,.45);box-shadow:0 0 0 3px rgba(139,94,60,.1)}
.field.bad input{border-color:rgba(194,65,12,.5);background:#fdf3ee}
.eye{position:absolute;right:6px;top:6px;width:32px;height:32px;border:0;background:none;border-radius:8px;display:grid;place-items:center;color:var(--tx3);cursor:pointer}
.eye:hover{color:var(--tx)}
.eye .i{width:17px;height:17px}
.err{font-size:12px;color:var(--er);margin-top:6px;display:none;align-items:center;gap:6px}
.err .i{width:13px;height:13px}
.field.bad .err{display:flex}

.suggest{position:absolute;left:14px;top:calc(100% + 8px);z-index:5;background:var(--tx);color:#f6f3ef;font-size:13px;padding:7px 11px;border-radius:8px;cursor:pointer;border:0;box-shadow:0 8px 24px rgba(40,25,10,.2);opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .2s,transform .2s var(--e)}
.suggest::before{content:"";position:absolute;left:14px;top:-5px;border:5px solid transparent;border-top:0;border-bottom-color:var(--tx)}
.suggest.show{opacity:1;transform:none;pointer-events:auto}
.suggest b{font-weight:500}
.suggest span{opacity:.5;margin-left:8px;font-size:11.5px}

.meter{display:flex;gap:4px;margin-top:8px}
.meter i{flex:1;height:3px;border-radius:9px;background:var(--ln);transition:background .3s}
form[data-mode="login"] .signup-only,form[data-mode="signup"] .login-only{display:none}

.row{display:flex;justify-content:space-between;align-items:center;margin:4px 0 20px;font-size:13px}
.check{display:flex;align-items:center;gap:8px;color:var(--tx2);cursor:pointer;user-select:none;margin:0;font-weight:400}
.check input{appearance:none;width:16px;height:16px;border-radius:5px;border:1px solid var(--ln2);display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.check input:checked{background:var(--tx);border-color:var(--tx)}
.check input:checked::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.check.bad{color:var(--er)}
.check.bad input{border-color:var(--er)}
.link{color:var(--br);text-decoration:none;font-weight:500;background:none;border:0;padding:0;cursor:pointer;font-size:inherit;line-height:inherit;display:inline-flex;align-items:center;gap:5px}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.link .i{width:13px;height:13px}

.submit{appearance:none;width:100%;height:44px;border:0;border-radius:10px;background:var(--tx);color:#fff;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,background .2s}
.submit:hover{background:#2a241f}
.submit:active{transform:scale(.99)}
.submit .i{transition:transform .25s var(--e)}
.submit:hover .i{transform:translateX(3px)}
.foot{text-align:center;color:var(--tx2);font-size:13.5px;margin-top:20px}

/* ikon animasyonları (odakta / ilk açılışta) */
.dr{stroke-dasharray:1;stroke-dashoffset:0}
.play .dr{animation:draw .7s var(--e) var(--dl,0s) both}
.play .wave{animation:wave 1.4s ease-in-out .2s both;transform-box:fill-box;transform-origin:70% 90%}
.play .pop{animation:pop .5s var(--e) var(--dl,0s) both;transform-box:fill-box;transform-origin:center}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes wave{15%{transform:rotate(16deg)}30%{transform:rotate(-10deg)}45%{transform:rotate(14deg)}60%{transform:rotate(-6deg)}75%{transform:rotate(8deg)}100%{transform:rotate(0)}}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.25)}100%{transform:scale(1)}}

/* ── başarı animasyonu ── */
.done-view{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .3s}
.done-view.on{opacity:1;pointer-events:auto}
.done-box{display:flex;flex-direction:column;align-items:center;gap:18px}
.ring{width:120px;height:120px;overflow:visible}
.ring .dots circle{fill:var(--tx)}
.ring .tick{fill:none;stroke:var(--br);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.done-t{font-family:'Instrument Serif',Georgia,serif;font-size:40px;letter-spacing:-.01em;opacity:0;transform:translateY(8px)}
.done-t em{color:var(--br)}
.done-s{color:var(--tx2);font-size:14px;margin-top:-10px;opacity:0;transform:translateY(8px)}

/* ── görsel (sağ) ── */
.visual{position:relative;border-radius:24px;overflow:hidden;background:#15100c;min-height:560px;isolation:isolate}
.visual canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#dots{touch-action:none;cursor:grab}
#dots:active{cursor:grabbing}
#over{pointer-events:none}
.motto{position:absolute;right:30px;bottom:26px;z-index:2;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(30px,3.6vw,52px);line-height:1;letter-spacing:-.01em;color:#f6efe6;text-shadow:0 2px 30px rgba(10,6,3,.7);pointer-events:none;text-align:right}
.motto em{font-style:italic;color:#e3c6a4}

@media (max-width:760px){
  .page{grid-template-columns:minmax(0,1fr) minmax(0,.8fr);gap:10px;padding:10px}
  .side{padding:4px 6px}
  .wrap{padding:22px 0}
  .sso{grid-template-columns:1fr}
  .visual{min-height:0;border-radius:18px}
  .motto{right:16px;bottom:16px}
}
@media (max-width:520px){
  .page{grid-template-columns:1fr}
  .visual{min-height:380px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script>
const $ = id => document.getElementById(id);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const visual = document.querySelector('.visual');

// panel üzerindeki fare (paralaks için, -0.5..0.5)
const mouse = {x:0,y:0,tx:0,ty:0};
visual.addEventListener('pointermove', e => { const r = visual.getBoundingClientRect(); mouse.tx = (e.clientX-r.left)/r.width-.5; mouse.ty = (e.clientY-r.top)/r.height-.5; });
visual.addEventListener('pointerleave', () => { mouse.tx = mouse.ty = 0; });

function glProgram(gl, vs, fs){
  const sh = (t,s) => { const o = gl.createShader(t); gl.shaderSource(o,s); gl.compileShader(o); return o; };
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  return gl.getProgramParameter(p, gl.LINK_STATUS) ? p : null;
}

/* ════════════════ 1. ARKA PLAN SHADER'I (siyah · espresso · karamel · krem) ════════════════ */
const bgGL = (() => {
  const c = $('bg'), gl = c.getContext('webgl', {antialias:false, alpha:false, powerPreference:'low-power'});
  if(!gl) return null;
  const pr = glProgram(gl, 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}', `precision highp float;
  uniform vec2 R;uniform float T;uniform vec2 M;uniform vec2 G;uniform float GR;
  float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
    return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
  float fbm(vec2 p){float v=0.,a=.5;mat2 r=mat2(.8,.6,-.6,.8);
    for(int i=0;i<5;i++){v+=a*n(p);p=r*p*2.03;a*=.5;}return v;}
  void main(){
    vec2 uv=gl_FragCoord.xy/R;
    vec2 p=(gl_FragCoord.xy-.5*R)/R.y;
    float t=T*.03;

    vec2 w=vec2(fbm(p*1.4+3.*q+vec2(1.7,9.2)+t*1.3),fbm(p*1.4+3.*q+vec2(8.3,2.8)-t));
    float f=fbm(p*1.1+2.4*w+M*.25);

function project(x,y,z){
  const cy = Math.cos(rotY), sy = Math.sin(rotY), cx = Math.cos(rotX), sx = Math.sin(rotX);
  const x1 = x*cy - z*sy, z1 = x*sy + z*cy;
  return [CX + x1*R, CY - (y*cx - z1*sx)*R, y*sx + z1*cx];
}
const slerp = (a,b,t) => {
  const d = Math.acos(Math.max(-1,Math.min(1,a[0]*b[0]+a[1]*b[1]+a[2]*b[2])));
  const s = Math.sin(d)||1, k1 = Math.sin((1-t)*d)/s, k2 = Math.sin(t*d)/s;
  return [a[0]*k1+b[0]*k2, a[1]*k1+b[1]*k2, a[2]*k1+b[2]*k2];
};

const t0 = performance.now();
function frame(now){
  const T = REDUCED ? 20 : (now-t0)/1000 + 20;
  mouse.x += (mouse.tx-mouse.x)*.05; mouse.y += (mouse.ty-mouse.y)*.05;
  if(!drag) rotY += velY;

  const cxo = CX + mouse.x*14;

    const {gl} = dotsGL;
    const cy = Math.cos(rotY), sy = Math.sin(rotY), cx = Math.cos(rotX), sx = Math.sin(rotX);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniformMatrix3fv(dotsGL.uM, false, [cy,-sx*sy,cx*sy, 0,cx,sx, -sy,-sx*cy,cx*cy]);
    gl.uniform2f(dotsGL.uC, cxo*dpr, (H-CY)*dpr);
    gl.uniform1f(dotsGL.uR, R*dpr);
    gl.uniform2f(dotsGL.uS, W*dpr, H*dpr);
    gl.uniform1f(dotsGL.uP, Math.max(1.6, R/150)*dpr);
    gl.uniform1f(dotsGL.uT, T);
    gl.drawArrays(gl.POINTS, 0, dotsGL.count);
  }

  over.setTransform(dpr,0,0,dpr,0,0); over.clearRect(0,0,W,H);
  const P = (x,y,z) => { const p = project(x,y,z); p[0] += cxo-CX; return p; };
  for(const r of routes){
    const A = cityV[r.a], B = cityV[r.b], pts = [];
    for(let k=0;k<=40;k++){ const u=k/40, v=slerp(A,B,u), l=1+.18*Math.sin(Math.PI*u); pts.push(P(v[0]*l,v[1]*l,v[2]*l)); }
    over.lineWidth = 1;
    for(let k=0;k<40;k++){
      const p = pts[k], q = pts[k+1];
      if(p[2] < -.05 && q[2] < -.05) continue;
      over.strokeStyle = `rgba(214,168,122,${.1+Math.max(0,p[2])*.35})`;
      over.beginPath(); over.moveTo(p[0],p[1]); over.lineTo(q[0],q[1]); over.stroke();
    }
    const u = ((T*.25 + r.off) % 1.5) / 1.5;
    if(u < 1){
      const idx = Math.floor(u*40), p = pts[idx];
      if(p[2] > -.05){
        const from = Math.max(0, idx-6), tail = pts[from];
        const lg = over.createLinearGradient(tail[0],tail[1],p[0],p[1]);
        lg.addColorStop(0,'rgba(246,239,230,0)'); lg.addColorStop(1,'rgba(246,239,230,.95)');
        over.strokeStyle = lg; over.lineWidth = 1.8; over.beginPath(); over.moveTo(tail[0],tail[1]);
        for(let k=from+1;k<=idx;k++) over.lineTo(pts[k][0],pts[k][1]);
        over.stroke();
        over.fillStyle = '#fff'; over.fillRect(p[0]-1.5,p[1]-1.5,3,3);
      }
    }
  }
  cityV.forEach((v,i) => {
    const [sx,sy,z] = P(...v);
    if(z < .05) return;
    const pulse = (T*.7 + i*.19) % 1, ps = 4 + pulse*14;
    over.strokeStyle = `rgba(227,198,164,${(1-pulse)*.8*z})`; over.lineWidth = 1;
    over.strokeRect(sx-ps/2, sy-ps/2, ps, ps);
    over.fillStyle = '#e3c6a4'; over.fillRect(sx-2.5,sy-2.5,5,5);
  });

  if(!REDUCED || !(dotsGL && dotsGL.count)) requestAnimationFrame(frame);
}

function suggestion(){

  const [user, dom=''] = v.split('@');
  if(!user) return null;

  const hit = DOMAINS.find(d => d.startsWith(dom) && d !== dom);

}

/* ── başarı animasyonu: 12 nokta çember olup döner → tik çizilir → "Success." ── */
const N = 12, ringDots = $('ringDots');
ringDots.style.transformBox = 'view-box'; ringDots.style.transformOrigin = '60px 60px';
for(let i=0;i<N;i++){
  const a = i/N*Math.PI*2 - Math.PI/2;
  const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('cx', (60 + Math.cos(a)*44).toFixed(2)); c.setAttribute('cy', (60 + Math.sin(a)*44).toFixed(2)); c.setAttribute('r', 3.6);
  c.style.transformBox = 'fill-box'; c.style.transformOrigin = 'center';
  ringDots.append(c);
}
let busy = false;
async function success(mode){
  if(busy) return; busy = true;
  const view = $('doneView'), dots = [...ringDots.children], tick = $('tick');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const ease = 'cubic-bezier(.22,1,.36,1)';
  $('doneS').textContent = COPY[mode].done;
  form.classList.add('away'); view.classList.add('on');
  // 1) noktalar tek tek belirip çemberi oluşturur
  dots.forEach((d,i) => d.animate([{transform:'scale(0)', opacity:0},{transform:'scale(1)', opacity:1}], {duration:380, delay:i*45, easing:ease, fill:'both'}));
  await sleep(N*45 + 250);
  // 2) çember döner, noktalar sırayla söner/yanar
  const spin = ringDots.animate([{transform:'rotate(0deg)'},{transform:'rotate(720deg)'}], {duration:1600, easing:'cubic-bezier(.45,0,.2,1)', fill:'forwards'});
  const fades = dots.map((d,i) => d.animate([{opacity:1},{opacity:.18},{opacity:1}], {duration:560, delay:i*45, iterations:2, easing:'ease-in-out'}));
  await spin.finished;
  // 3) noktalar kahverengiye döner, aralarından tik çizilir
  dots.forEach((d,i) => d.animate([{fill:'#141210', transform:'scale(1)'},{fill:'#8b5e3c', transform:'scale(1.4)'},{fill:'#8b5e3c', transform:'scale(1)'}], {duration:420, delay:i*18, fill:'forwards', easing:'ease-out'}));
  tick.animate([{strokeDashoffset:1},{strokeDashoffset:0}], {duration:520, delay:140, easing:'cubic-bezier(.65,0,.35,1)', fill:'forwards'});
  await sleep(480);
  // 4) "Success."
  $('doneT').animate([{opacity:0, transform:'translateY(8px)'},{opacity:1, transform:'none'}], {duration:500, easing:ease, fill:'forwards'});
  $('doneS').animate([{opacity:0, transform:'translateY(8px)'},{opacity:1, transform:'none'}], {duration:500, delay:120, easing:ease, fill:'forwards'});
  // demo: bir süre sonra forma geri dön
  await sleep(3400);
  view.classList.remove('on'); form.classList.remove('away');
  await sleep(350);
  [spin, ...fades].forEach(a => a.cancel());
  [...dots, tick, $('doneT'), $('doneS')].forEach(el => el.getAnimations().forEach(a => a.cancel()));
  busy = false;
}

// Demo: hiçbir yere veri gönderilmez.
form.addEventListener('submit', e => {
  e.preventDefault();
  const signup = form.dataset.mode === 'signup';
  const okEmail = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email.value.trim());
  const okPass = $('pass').value.length >= 8;
  const okName = !signup || $('name').value.trim().length > 0;
  const okTerms = !signup || $('terms').checked;
  $('emailField').classList.toggle('bad', !okEmail);
  $('passField').classList.toggle('bad', !okPass);
  $('nameField').classList.toggle('bad', !okName);
  $('termsLbl').classList.toggle('bad', !okTerms);
  if(!(okEmail && okPass && okName && okTerms)) return;
  success(form.dataset.mode);
});
form.querySelectorAll('[data-sso]').forEach(b => b.addEventListener('click', () => {
  const s = b.querySelector('span'), o = s.textContent;
  s.textContent = 'Yönlendiriliyor…'; setTimeout(() => s.textContent = o, 1400);
}));
</script>
