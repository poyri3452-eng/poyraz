<style>
:root{
  --bg:#ffffff;
  --tx:#141210;--tx2:#6e675f;--tx3:#a39b91;
  --field:#f6f3ef;--field-f:#f3ebe2;--ln:#e8e2da;--ln2:#d8cfc4;
  --br:#8b5e3c;          /* kahverengi vurgu */
  --br2:#b08462;
  --er:#c2410c;--ok:#3f7d4e;
  --e:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}

.page{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;padding:16px}

/* ── form ── */
.side{display:flex;flex-direction:column;padding:10px 24px}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;color:var(--tx);text-decoration:none}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--tx);display:grid;place-items:center;color:#f3ebe2;font-style:normal;font-weight:700;font-size:13px}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:36px 0}
form{width:100%;max-width:380px}
h1{font-weight:400;font-size:clamp(34px,4vw,44px);letter-spacing:-.035em;line-height:1.05}
.lead{color:var(--tx2);font-size:14.5px;margin:10px 0 26px;line-height:1.5}

.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--field);border-radius:10px;padding:3px;margin-bottom:20px;position:relative}
.tabs button{appearance:none;border:0;background:none;padding:8px;font-size:13.5px;font-weight:500;color:var(--tx2);cursor:pointer;position:relative;z-index:1;transition:color .2s}
.tabs button[aria-selected="true"]{color:var(--tx)}
.tabs .pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:8px;background:#fff;box-shadow:0 1px 2px rgba(40,25,10,.08),0 0 0 1px var(--ln);transition:transform .4s var(--e)}
.tabs[data-mode="signup"] .pill{transform:translateX(100%)}

.sso{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbtn{appearance:none;border:1px solid var(--ln);background:#fff;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:9px;font-size:13.5px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.sbtn:hover{background:var(--field);border-color:var(--ln2)}
.sbtn:active{transform:scale(.98)}
.sbtn svg{width:17px;height:17px}
.or{display:flex;align-items:center;gap:12px;color:var(--tx3);font-size:12.5px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--ln)}

.field{margin-bottom:14px;position:relative}
label{display:block;font-size:12.5px;font-weight:500;color:var(--tx2);margin-bottom:6px}
.inp{position:relative}
.inp input{width:100%;height:44px;border-radius:10px;border:1px solid transparent;background:var(--field);padding:0 42px 0 14px;font-size:14px;outline:none;transition:border-color .2s,background .2s,box-shadow .2s}
.inp input::placeholder{color:var(--tx3)}
.inp input:focus{background:var(--field-f);border-color:rgba(139,94,60,.45);box-shadow:0 0 0 3px rgba(139,94,60,.1)}
.field.bad input{border-color:rgba(194,65,12,.5);background:#fdf3ee}
.eye{position:absolute;right:6px;top:6px;width:32px;height:32px;border:0;background:none;border-radius:8px;display:grid;place-items:center;color:var(--tx3);cursor:pointer}
.eye:hover{color:var(--tx)}
.eye svg{width:17px;height:17px}
.err{font-size:12px;color:var(--er);margin-top:6px;display:none}
.field.bad .err{display:block}

.suggest{position:absolute;left:14px;top:calc(100% + 8px);z-index:5;background:var(--tx);color:#f6f3ef;font-size:13px;padding:7px 11px;border-radius:8px;cursor:pointer;border:0;box-shadow:0 8px 24px rgba(40,25,10,.2);opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .2s,transform .2s var(--e)}
.suggest::before{content:"";position:absolute;left:14px;top:-5px;border:5px solid transparent;border-top:0;border-bottom-color:var(--tx)}
.suggest.show{opacity:1;transform:none;pointer-events:auto}
.suggest b{font-weight:500}
.suggest span{opacity:.5;margin-left:8px;font-size:11.5px}

.meter{display:flex;gap:4px;margin-top:8px}
.meter i{flex:1;height:3px;border-radius:9px;background:var(--ln);transition:background .3s}
form[data-mode="login"] .signup-only,form[data-mode="signup"] .login-only{display:none}

.row{display:flex;justify-content:space-between;align-items:center;margin:4px 0 20px;font-size:13px}
.check{display:flex;align-items:center;gap:8px;color:var(--tx2);cursor:pointer;user-select:none;margin:0}
.check input{appearance:none;width:16px;height:16px;border-radius:5px;border:1px solid var(--ln2);display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.check input:checked{background:var(--tx);border-color:var(--tx)}
.check input:checked::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.check.bad{color:var(--er)}
.check.bad input{border-color:var(--er)}
.link{color:var(--br);text-decoration:none;font-weight:500;background:none;border:0;padding:0;cursor:pointer;font-size:inherit;line-height:inherit}
.link:hover{text-decoration:underline;text-underline-offset:3px}

.submit{appearance:none;width:100%;height:44px;border:0;border-radius:10px;background:var(--tx);color:#fff;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,background .2s}
.submit:hover{background:#2a241f}
.submit:active{transform:scale(.99)}
.submit .sp{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;display:none}
.submit.busy .sp{display:block}
.submit.done{background:var(--ok)}
@keyframes spin{to{transform:rotate(360deg)}}
.foot{text-align:center;color:var(--tx2);font-size:13.5px;margin-top:20px}

/* ── görsel (sağ) ── */
.visual{position:relative;border-radius:24px;overflow:hidden;background:#15100c;min-height:560px;isolation:isolate}
.visual canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#globe{touch-action:none;cursor:grab}
#globe:active{cursor:grabbing}
.motto{position:absolute;right:30px;bottom:26px;z-index:2;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(30px,3.6vw,52px);line-height:1;letter-spacing:-.01em;color:#f6efe6;text-shadow:0 2px 30px rgba(10,6,3,.7);pointer-events:none;text-align:right}
.motto em{font-style:italic;color:#e3c6a4}

@media (max-width:760px){
  .page{grid-template-columns:minmax(0,1fr) minmax(0,.8fr);gap:10px;padding:10px}
  .side{padding:4px 6px}
  .wrap{padding:22px 0}
  .sso{grid-template-columns:1fr}
  .visual{min-height:0;border-radius:18px}
  .motto{right:16px;bottom:16px}
}
@media (max-width:520px){
  .page{grid-template-columns:1fr}
  .visual{min-height:380px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="page">

  <!-- ═══ FORM (sol) ═══ -->
  <div class="side">
    <a class="logo" href="#"><i>N</i>Neo AI</a>
    <div class="wrap">
      <form id="form" data-mode="login" novalidate>
        <h1 id="title">Tekrar hoş geldin</h1>

        <div class="tabs" id="tabs" role="tablist" data-mode="login">
          <span class="pill"></span>
          <button type="button" role="tab" aria-selected="true" data-mode="login">Giriş yap</button>
          <button type="button" role="tab" aria-selected="false" data-mode="signup">Kayıt ol</button>

        <div class="sso">

            <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.6 12.3c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.6c2.1-1.9 3.3-4.8 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.7c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.1v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.8 14.2a6.6 6.6 0 0 1 0-4.3V7.1H2.1a11 11 0 0 0 0 9.9z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2A11 11 0 0 0 2.1 7.1l3.7 2.8C6.7 7.3 9.1 5.4 12 5.4z"/></svg>
            <span>Google</span>
          </button>
          <button class="sbtn" type="button" data-sso>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5a10.5 10.5 0 0 0-3.3 20.5c.5.1.7-.2.7-.5v-1.8c-2.9.6-3.5-1.4-3.5-1.4-.5-1.2-1.2-1.5-1.2-1.5-1-.7.1-.7.1-.7 1 .1 1.6 1.1 1.6 1.1.9 1.6 2.5 1.2 3.1.9.1-.7.4-1.2.7-1.4-2.3-.3-4.8-1.2-4.8-5.2 0-1.1.4-2.1 1.1-2.8-.1-.3-.5-1.4.1-2.8 0 0 .9-.3 2.9 1.1a10 10 0 0 1 5.2 0c2-1.4 2.9-1.1 2.9-1.1.6 1.4.2 2.5.1 2.8.7.7 1.1 1.7 1.1 2.8 0 4-2.5 4.9-4.8 5.2.4.3.7 1 .7 1.9v2.9c0 .3.2.6.7.5A10.5 10.5 0 0 0 12 1.5z"/></svg>
            <span>GitHub</span>
          </button>
        </div>

        <div class="or">veya e-posta ile</div>

        <div class="field signup-only" id="nameField">
          <label for="name">Adın</label>
          <div class="inp"><input id="name" autocomplete="name" placeholder="Adın soyadın"></div>
          <div class="err">Sana nasıl hitap edelim?</div>
        </div>

        <div class="field" id="emailField">
          <label for="email">E-posta adresi</label>
          <div class="inp"><input id="email" type="email" inputmode="email" autocomplete="email" placeholder="ornek@mail.com" spellcheck="false"></div>
          <button type="button" class="suggest" id="suggest"><b></b><span>Tab</span></button>
          <div class="err">Geçerli bir e-posta adresi gir.</div>
        </div>

        <div class="field" id="passField">
          <label for="pass">Şifre</label>
          <div class="inp">
            <input id="pass" type="password" autocomplete="current-password" placeholder="Şifreni gir">
            <button class="eye" id="eye" type="button" aria-label="Şifreyi göster">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/><path id="eyeSlash" d="M4 4l16 16" style="display:none"/></svg>
            </button>
          </div>
          <div class="meter signup-only" id="meter"><i></i><i></i><i></i><i></i></div>
          <div class="err">Şifre en az 8 karakter olmalı.</div>
        </div>

        <div class="row login-only">
          <label class="check"><input type="checkbox" checked> Beni hatırla</label>
          <button class="link" type="button">Şifremi unuttum</button>
        </div>
        <div class="row signup-only" style="justify-content:flex-start">
          <label class="check" id="termsLbl"><input type="checkbox" id="terms"> <span>Kullanım koşullarını kabul ediyorum</span></label>
        </div>

        <button class="submit" id="submit" type="submit"><span class="sp"></span><span id="submitLbl">Giriş yap</span></button>
        <p class="foot" id="foot">Neo'da yeni misin? <button class="link" type="button" data-go="signup">Hesap oluştur</button></p>
      </form>
    </div>
  </div>

  <!-- ═══ GÖRSEL (sağ) ═══ -->
  <aside class="visual">
    <canvas id="bg" aria-hidden="true"></canvas>
    <canvas id="globe" aria-label="Dönen yarım dünya"></canvas>
    <p class="motto">Create the <em>Future.</em></p>
  </aside>
</div>

<script>
const $ = id => document.getElementById(id);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ════════════════ 1. SHADER (siyah · kahve · krem) ════════════════ */
(() => {
  const c = $('bg'), gl = c.getContext('webgl', {antialias:false, alpha:false, powerPreference:'low-power'});
  if(!gl) return;
  const VS = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  const FS = `precision highp float;
  uniform vec2 R;uniform float T;uniform vec2 M;
  float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
    return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
  float fbm(vec2 p){float v=0.,a=.5;mat2 r=mat2(.8,.6,-.6,.8);
    for(int i=0;i<5;i++){v+=a*n(p);p=r*p*2.03;a*=.5;}return v;}
  void main(){
    vec2 uv=gl_FragCoord.xy/R;
    vec2 p=(gl_FragCoord.xy-.5*R)/R.y;
    float t=T*.03;
    vec2 q=vec2(fbm(p*1.2+vec2(0.,t)),fbm(p*1.2+vec2(5.2,1.3)-t));
    vec2 w=vec2(fbm(p*1.4+3.*q+vec2(1.7,9.2)+t*1.3),fbm(p*1.4+3.*q+vec2(8.3,2.8)-t));
    float f=fbm(p*1.1+2.4*w+M*.1);
    vec3 col=vec3(.035,.026,.02);                                   // siyaha yakın
    col=mix(col,vec3(.2,.12,.07),smoothstep(.28,.62,f));             // espresso
    col=mix(col,vec3(.55,.36,.22),smoothstep(.58,.88,f)*.7);         // karamel
    col=mix(col,vec3(.93,.84,.72),smoothstep(.8,1.05,f+length(w)*.15)*.35); // krem ışık
    col*=.55+.6*uv.y;                                                 // altta koyulaşma
    col+=(h(gl_FragCoord.xy+fract(T)*97.)-.5)*.04;                    // film greni
    gl_FragColor=vec4(col,1.);
  }`;
  const sh = (t,s) => { const o = gl.createShader(t); gl.shaderSource(o,s); gl.compileShader(o); return o; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr, gl.LINK_STATUS)) return;
  gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const uR = gl.getUniformLocation(pr,'R'), uT = gl.getUniformLocation(pr,'T'), uM = gl.getUniformLocation(pr,'M');
  const SCALE = .5, mouse = {x:0,y:0,tx:0,ty:0};
  addEventListener('pointermove', e => { mouse.tx = e.clientX/innerWidth-.5; mouse.ty = .5-e.clientY/innerHeight; });
  function size(){ const r = c.getBoundingClientRect(); c.width = Math.ceil(r.width*SCALE); c.height = Math.ceil(r.height*SCALE); gl.viewport(0,0,c.width,c.height); gl.uniform2f(uR,c.width,c.height); }
  new ResizeObserver(size).observe(c); size();
  const t0 = performance.now();
  function frame(now){
    mouse.x += (mouse.tx-mouse.x)*.04; mouse.y += (mouse.ty-mouse.y)*.04;
    gl.uniform1f(uT, REDUCED ? 20 : (now-t0)/1000 + 20);
    gl.uniform2f(uM, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLES,0,3);
    if(!REDUCED) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

    const m = document.createElement('canvas'); m.width = img.width; m.height = img.height;
    const mc = m.getContext('2d'); mc.drawImage(img,0,0);
    const data = mc.getImageData(0,0,m.width,m.height).data;
    const land = (lat,lon) => data[(Math.min(m.height-1,Math.floor((90-lat)/180*m.height))*m.width + Math.floor((lon+180)/360*m.width)%m.width)*4] > 128;
    const STEP = 1.6, out = [];
    for(let lat=-86; lat<=86; lat+=STEP){
      const n = Math.max(1, Math.round(360*Math.cos(rad(lat))/STEP));
      for(let i=0;i<n;i++){ const lon = -180 + i*360/n; if(land(lat,lon)) out.push(...toVec(lat,lon)); }
    }
    dots = new Float32Array(out);
  };
  img.src = LAND;

  let W=0, H=0, R=0, CX=0, CY=0, dpr=1;
  function size(){
    dpr = Math.min(devicePixelRatio||1, 2);
    const r = cv.getBoundingClientRect(); W = r.width; H = r.height;
    cv.width = W*dpr; cv.height = H*dpr;
    R = Math.max(Math.min(W*.62, H*.78), Math.min(W*.95, H*.5)); // büyük küre; dar panelde yanlardan taşar
    CX = W*.5; CY = H + R*.02;         // merkez alt kenarda → üst yarısı görünür
  }
  new ResizeObserver(size).observe(cv); size();

  let rotY = rad(-25), rotX = rad(-28), drag = null;
  const velY = REDUCED ? 0 : .0013;
  cv.addEventListener('pointerdown', e => { drag = {x:e.clientX,ry:rotY}; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => { if(drag) rotY = drag.ry + (e.clientX-drag.x)*.006; });
  cv.addEventListener('pointerup', () => drag = null);

  function project(x,y,z){
    const cy = Math.cos(rotY), sy = Math.sin(rotY), cx = Math.cos(rotX), sx = Math.sin(rotX);
    const x1 = x*cy - z*sy, z1 = x*sy + z*cy;
    const y2 = y*cx - z1*sx, z2 = y*sx + z1*cx;
    return [CX + x1*R, CY - y2*R, z2];
  }
  const slerp = (a,b,t) => {
    const d = Math.acos(Math.max(-1,Math.min(1,a[0]*b[0]+a[1]*b[1]+a[2]*b[2])));
    const s = Math.sin(d)||1, k1 = Math.sin((1-t)*d)/s, k2 = Math.sin(t*d)/s;
    return [a[0]*k1+b[0]*k2, a[1]*k1+b[1]*k2, a[2]*k1+b[2]*k2];
  };
  const cityV = CITIES.map(c => toVec(c[0],c[1]));
  const routes = ROUTES.map(([a,b],i) => ({a,b,off:i*.31}));

  let t = 0;
  function draw(){
    t += 1/60;
    if(!drag) rotY += velY;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);

    // ufuk parıltısı
    const g = ctx.createRadialGradient(CX,CY,R*.9,CX,CY,R*1.18);
    g.addColorStop(0,'rgba(227,198,164,0)'); g.addColorStop(.3,'rgba(227,198,164,.18)'); g.addColorStop(1,'rgba(227,198,164,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(CX,CY,R*1.18,0,Math.PI*2); ctx.fill();
    // küre gövdesi
    const body = ctx.createRadialGradient(CX-R*.2,CY-R*.7,R*.05,CX,CY,R);
    body.addColorStop(0,'rgba(70,48,32,.55)'); body.addColorStop(1,'rgba(14,10,7,.9)');
    ctx.fillStyle = body; ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(227,198,164,.25)'; ctx.lineWidth = 1; ctx.stroke();

    // kare noktalar
    const px = Math.max(1.8, R/140);
    for(let i=0;i<dots.length;i+=3){
      const [sx,sy,z] = project(dots[i],dots[i+1],dots[i+2]);
      if(z < -.02 || sy > H+4) continue;
      const s = px*(.5+.5*z);
      ctx.fillStyle = `rgba(${236+z*10|0},${222+z*16|0},${200+z*28|0},${Math.min(1,.12+z*.95)})`;
      ctx.fillRect(sx-s/2, sy-s/2, s, s);
    }

    // rotalar
    for(const r of routes){
      const A = cityV[r.a], B = cityV[r.b], pts = [];
      for(let k=0;k<=40;k++){ const u=k/40, v=slerp(A,B,u), l=1+.18*Math.sin(Math.PI*u); pts.push(project(v[0]*l,v[1]*l,v[2]*l)); }
      ctx.lineWidth = 1;
      for(let k=0;k<40;k++){
        const p = pts[k], q = pts[k+1];
        if(p[2] < -.05 && q[2] < -.05) continue;
        ctx.strokeStyle = `rgba(214,168,122,${.1+Math.max(0,p[2])*.35})`;
        ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); ctx.stroke();
      }
      const u = ((t*.25 + r.off) % 1.5) / 1.5;
      if(u < 1){
        const idx = Math.floor(u*40), p = pts[idx];
        if(p[2] > -.05){
          const from = Math.max(0, idx-6), tail = pts[from];
          const lg = ctx.createLinearGradient(tail[0],tail[1],p[0],p[1]);
          lg.addColorStop(0,'rgba(246,239,230,0)'); lg.addColorStop(1,'rgba(246,239,230,.95)');
          ctx.strokeStyle = lg; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(tail[0],tail[1]);
          for(let k=from+1;k<=idx;k++) ctx.lineTo(pts[k][0],pts[k][1]);
          ctx.stroke();
          ctx.fillStyle = '#fff'; ctx.fillRect(p[0]-1.5,p[1]-1.5,3,3);
        }
      }
    }

    // şehir kareleri (yazısız)
    cityV.forEach((v,i) => {
      const [sx,sy,z] = project(...v);
      if(z < .05) return;
      const pulse = (t*.7 + i*.19) % 1, ps = 4 + pulse*14;
      ctx.strokeStyle = `rgba(227,198,164,${(1-pulse)*.8*z})`; ctx.lineWidth = 1;
      ctx.strokeRect(sx-ps/2, sy-ps/2, ps, ps);
      ctx.fillStyle = '#e3c6a4'; ctx.fillRect(sx-2.5,sy-2.5,5,5);
    });

    if(!REDUCED || !dots.length) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

/* ════════════════ 3. FORM ════════════════ */
const form = $('form');
const COPY = {
  login:{title:'Tekrar hoş geldin',lead:'Hesabına giriş yap ve Neo ile kaldığın yerden devam et.',btn:'Giriş yap',foot:['Neo\'da yeni misin? ','Hesap oluştur','signup'],ac:'current-password'},
  signup:{title:'Neo\'ya katıl',lead:'Birkaç saniyede hesabını oluştur, hemen sohbete başla.',btn:'Hesap oluştur',foot:['Zaten hesabın var mı? ','Giriş yap','login'],ac:'new-password'}
};
function setMode(m){
  form.dataset.mode = m; $('tabs').dataset.mode = m;
  $('tabs').querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', b.dataset.mode===m));
  const c = COPY[m];
  $('title').textContent = c.title; $('lead').textContent = c.lead; $('submitLbl').textContent = c.btn; $('pass').autocomplete = c.ac;
  const f = $('foot'); f.replaceChildren(c.foot[0]);
  const l = document.createElement('button'); l.type='button'; l.className='link'; l.textContent=c.foot[1]; l.dataset.go=c.foot[2]; f.append(l);
  form.querySelectorAll('.field,.check').forEach(x => x.classList.remove('bad'));
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if(b) setMode(b.dataset.mode); });
form.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if(g) setMode(g.dataset.go); });

const DOMAINS = ['gmail.com','hotmail.com','outlook.com','icloud.com','yahoo.com','yandex.com'];
const email = $('email'), sug = $('suggest');
function suggestion(){
  const v = email.value.trim();
  if(!v || /\s/.test(v) || v.split('@').length > 2) return null;
  const [user, dom=''] = v.split('@');
  if(!user) return null;
  if(!v.includes('@')) return user + '@' + DOMAINS[0];
  const hit = DOMAINS.find(d => d.startsWith(dom) && d !== dom);
  return hit ? user + '@' + hit : null;
}
function updateSug(){ const s = document.activeElement === email ? suggestion() : null; sug.classList.toggle('show', !!s); if(s) sug.querySelector('b').textContent = s; }
function acceptSug(){ const s = suggestion(); if(s){ email.value = s; updateSug(); $('emailField').classList.remove('bad'); } }
email.addEventListener('input', () => { updateSug(); $('emailField').classList.remove('bad'); });
email.addEventListener('focus', updateSug);
email.addEventListener('blur', () => setTimeout(updateSug, 120));
email.addEventListener('keydown', e => { if(e.key==='Tab' && sug.classList.contains('show')){ e.preventDefault(); acceptSug(); } });
sug.addEventListener('mousedown', e => { e.preventDefault(); acceptSug(); });

$('eye').addEventListener('click', () => {
  const p = $('pass'), show = p.type === 'password';
  p.type = show ? 'text' : 'password';
  $('eyeSlash').style.display = show ? 'block' : 'none';
  $('eye').setAttribute('aria-label', show ? 'Şifreyi gizle' : 'Şifreyi göster');
});
$('pass').addEventListener('input', () => {
  $('passField').classList.remove('bad');
  const v = $('pass').value;
  const score = [v.length >= 8, /[A-ZÇĞİÖŞÜ]/.test(v) && /[a-zçğıöşü]/.test(v), /\d/.test(v), /[^\w\sçğıöşüÇĞİÖŞÜ]/.test(v)].filter(Boolean).length;
  const col = ['var(--er)','var(--er)','#c08a2e','#8b5e3c','var(--ok)'][score];
  $('meter').querySelectorAll('i').forEach((i,n) => i.style.background = n < score ? col : '');
});
$('name').addEventListener('input', () => $('nameField').classList.remove('bad'));
$('terms').addEventListener('change', () => $('termsLbl').classList.remove('bad'));

// Demo: hiçbir yere veri gönderilmez.
form.addEventListener('submit', e => {
  e.preventDefault();
  const signup = form.dataset.mode === 'signup';
  const okEmail = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email.value.trim());
  const okPass = $('pass').value.length >= 8;
  const okName = !signup || $('name').value.trim().length > 0;
  const okTerms = !signup || $('terms').checked;
  $('emailField').classList.toggle('bad', !okEmail);
  $('passField').classList.toggle('bad', !okPass);
  $('nameField').classList.toggle('bad', !okName);
  $('termsLbl').classList.toggle('bad', !okTerms);
  if(!(okEmail && okPass && okName && okTerms)) return;
  const b = $('submit'); b.classList.add('busy'); b.disabled = true;
  setTimeout(() => {
    b.classList.remove('busy'); b.classList.add('done');
    $('submitLbl').textContent = signup ? 'Hesabın hazır ✓' : 'Giriş başarılı ✓';
    setTimeout(() => { b.classList.remove('done'); b.disabled = false; $('submitLbl').textContent = COPY[form.dataset.mode].btn; }, 2200);
  }, 1100);
});
form.querySelectorAll('[data-sso]').forEach(b => b.addEventListener('click', () => {
  const s = b.querySelector('span'), o = s.textContent;
  s.textContent = 'Yönlendiriliyor…'; setTimeout(() => s.textContent = o, 1400);
}));
</script>
