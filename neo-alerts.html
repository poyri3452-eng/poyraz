<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neo Uyarıları</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090e;
  --sf:#111216;          /* uyarı yüzeyi */
  --sf2:#17181d;
  --ln:rgba(255,255,255,.08);
  --ln2:rgba(255,255,255,.14);
  --tx:#ededf0;
  --tx2:#8e8f99;
  --tx3:#5d5e66;
  --ok:#3fb950;--info:#58a6ff;--warn:#d29922;--err:#f85149;--ai:#a78bfa;
  --e:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
button{font:inherit;color:inherit}

main{max-width:1120px;margin:0 auto;padding:56px 16px 140px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:28px}
h1{font-size:26px;font-weight:600;letter-spacing:-.02em}
.sub{color:var(--tx2);font-size:14px;margin-top:4px}
.btn{appearance:none;border:1px solid var(--ln2);background:var(--sf);border-radius:10px;padding:9px 14px;font-size:13.5px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{background:var(--sf2)}

.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:32px}
.search{width:100%;max-width:380px;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px 13px;color:var(--tx);font:14px 'DM Sans',sans-serif;outline:none}
.search:focus{border-color:var(--ln2)}
.search::placeholder{color:var(--tx3)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;appearance:none;border:1px solid transparent;background:none;color:var(--tx2);font-size:13px;padding:6px 11px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{color:var(--tx)}
.chip[aria-pressed="true"]{background:var(--sf);border-color:var(--ln);color:var(--tx)}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--c)}

section{margin-bottom:40px}
h2{font-size:12px;font-weight:500;color:var(--tx3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px;align-items:start}
.empty{color:var(--tx3);text-align:center;padding:60px 0;display:none}

/* ═══════════ UYARI ═══════════ */
.n{--c:var(--tx);position:relative;background:var(--sf);border:1px solid var(--ln);border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:13px;color:var(--tx2);line-height:1.45;text-align:left}
.n.ok{--c:var(--ok)}.n.info{--c:var(--info)}.n.warn{--c:var(--warn)}.n.err{--c:var(--err)}.n.ai{--c:var(--ai)}
.row{display:flex;gap:11px;align-items:flex-start;padding:13px 13px 13px 14px}
.ic{flex:none;width:20px;height:20px;color:var(--c);margin-top:1px}
.ic svg{width:20px;height:20px;overflow:visible}
.tx{flex:1;min-width:0}
.t{color:var(--tx);font-size:13.5px;font-weight:500}
.d{margin-top:2px}
.x{flex:none;appearance:none;border:0;background:none;color:var(--tx3);width:22px;height:22px;margin:-2px -3px 0 0;border-radius:6px;display:grid;place-items:center;cursor:pointer}
.x:hover{color:var(--tx);background:rgba(255,255,255,.06)}
.x svg{width:13px;height:13px}

/* pill */
.n.v-pill{border-radius:99px;display:inline-flex;justify-self:start}
.n.v-pill .row{padding:9px 16px 9px 12px;align-items:center;gap:9px}
.n.v-pill .ic,.n.v-pill .ic svg{width:18px;height:18px}
.n.v-pill .ic{margin:0}

/* aksiyon */
.acts{display:flex;justify-content:flex-end;gap:8px;padding:0 13px 12px}
.b{appearance:none;border:1px solid var(--ln2);background:none;color:var(--tx);font-size:12.5px;font-weight:500;padding:6px 11px;border-radius:8px;cursor:pointer;transition:background .15s}
.b:hover{background:rgba(255,255,255,.06)}
.b.p{background:var(--tx);color:#0b0b0e;border-color:var(--tx)}
.b.p:hover{background:#fff}
.lnk{appearance:none;border:0;background:none;color:var(--tx);font-size:13px;font-weight:500;cursor:pointer;text-decoration:underline;text-decoration-color:var(--ln2);text-underline-offset:3px;white-space:nowrap}
.lnk:hover{text-decoration-color:var(--tx)}

/* ilerleme */
.bar{height:4px;border-radius:99px;background:rgba(255,255,255,.07);margin-top:10px;overflow:hidden}
.bar span{display:block;height:100%;width:var(--v);background:var(--c);border-radius:inherit;transform-origin:left}
.play .bar span{animation:barIn 1s var(--e) .15s both}
.pv{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums}

/* meta */
.meta{margin-top:7px;font-size:12px;color:var(--tx3);display:flex;align-items:center;gap:6px}
.meta i{width:3px;height:3px;border-radius:50%;background:var(--tx3)}

/* geri al */
.n.v-undo .row{align-items:center}
.ring{flex:none;width:18px;height:18px;color:var(--tx3)}
.ring circle{stroke-dasharray:1;stroke-dashoffset:0}
.play .ring .rg{animation:ring 5s linear both}

/* dosya çipi */
.file{margin-top:9px;display:flex;align-items:center;gap:9px;padding:7px 9px;border:1px solid var(--ln);border-radius:8px;background:rgba(255,255,255,.02)}
.file b{font-weight:500;color:var(--tx);font-size:12.5px}
.file span{font-size:12px;color:var(--tx3);margin-left:auto}
.file .fi{width:22px;height:26px;border-radius:4px;background:rgba(255,255,255,.06);display:grid;place-items:center;font-size:8px;font-weight:600;color:var(--tx2);letter-spacing:.02em}

/* afiş */
.n.v-banner{grid-column:1/-1}
.n.v-banner .row{align-items:center}
.n.v-banner .tx{display:flex;flex-wrap:wrap;gap:0 8px;align-items:baseline}
.n.v-banner .d{margin:0}

/* klavye */
.keys{display:flex;gap:5px;margin-top:9px;align-items:center;font-size:12px;color:var(--tx3)}
kbd{font:500 12px 'DM Sans',sans-serif;color:var(--tx);min-width:24px;padding:3px 7px;text-align:center;border-radius:6px;background:var(--sf2);border:1px solid var(--ln2);border-bottom-width:2px}
.play kbd{animation:press .5s ease both}
.play kbd:nth-of-type(2){animation-delay:.25s}

/* dalga */
.wave{display:flex;align-items:center;gap:3px;height:26px;margin-top:9px}
.wave i{flex:1;max-width:4px;height:100%;border-radius:2px;background:var(--c);opacity:.8;transform:scaleY(.25)}
.play .wave i{animation:wv 1.1s ease-in-out infinite}

/* güç göstergesi */
.str{display:flex;gap:4px;margin-top:10px}
.str i{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.07)}
.str i.on{background:var(--c)}
.play .str i.on{animation:barIn .6s var(--e) .2s both}

/* yükleniyor */
.shim{background:linear-gradient(90deg,var(--tx) 0%,var(--tx2) 40%,var(--tx) 60%,var(--tx) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 2.2s linear infinite}

.badge{font-size:10.5px;font-weight:600;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:1px}

/* ═══════════ SVG ANİMASYONLARI ═══════════ */
.ic *{transform-box:fill-box;transform-origin:center}
.ic .vb{transform-box:view-box}
.ic .ob{transform-origin:bottom}
.ic .ol{transform-origin:left}
.play .dr{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s var(--e) var(--dl,0s) both}
.play .pop{animation:pop .5s var(--e) var(--dl,0s) both}
.play .spin{animation:spin .9s var(--e) var(--dl,0s) both}
.play .spinr{animation:spinr .9s var(--e) var(--dl,0s) both}
.play .swing{animation:swing .9s ease-in-out var(--dl,0s) both}
.play .shake{animation:shake .5s ease-in-out var(--dl,0s) both}
.play .rise{animation:rise .6s var(--e) var(--dl,0s) both}
.play .fall{animation:fall .6s var(--e) var(--dl,0s) both}
.play .drop{animation:drop .7s var(--e) var(--dl,0s) both}
.play .blink{animation:blink .6s ease var(--dl,0s) 3 both}
.play .grow{animation:grow .6s var(--e) var(--dl,0s) both}
.play .gx{animation:gx .6s var(--e) var(--dl,0s) both}
.play .tilt{animation:tilt .8s var(--e) var(--dl,0s) both}
.play .tilt2{animation:tilt2 .8s var(--e) var(--dl,0s) both}
.play .beat{animation:beat .6s ease var(--dl,0s) 2 both}
.play .sl{animation:sl .6s var(--e) var(--dl,0s) both}
.play .sr{animation:sr .6s var(--e) var(--dl,0s) both}
.play .in1{animation:in1 .6s var(--e) var(--dl,0s) both}
.play .in2{animation:in2 .6s var(--e) var(--dl,0s) both}
.play .turn{animation:turn .7s var(--e) var(--dl,0s) both}
.play .fade{animation:fade .5s ease var(--dl,0s) both}
.play .fout{animation:fout .6s ease var(--dl,0s) both}
.play .needle{animation:needle 1s var(--e) var(--dl,0s) both}
.play .tick{animation:tick 1.1s var(--e) var(--dl,0s) both}
.play .flip{animation:flip .9s var(--e) var(--dl,0s) both}
.play .lock{animation:lock .6s var(--e) var(--dl,0s) both}
.play .knob{animation:knob .6s var(--e) var(--dl,0s) both}
.play .k1{animation:k1 .8s var(--e) var(--dl,0s) both}
.play .k2{animation:k2 .8s var(--e) var(--dl,0s) both}
.play .k3{animation:k3 .8s var(--e) var(--dl,0s) both}
.play .press{animation:press .4s ease var(--dl,0s) both}
.play .rock{animation:rock .8s ease-in-out var(--dl,0s) both}
.play .bob{animation:bob .7s ease-in-out var(--dl,0s) 2 both}
.play .orbit{animation:orbit 1.6s linear infinite}
.play .scan{animation:scan 1.6s ease-in-out infinite}
.play .ping{animation:ping 1.4s ease-out var(--dl,0s) infinite}
.play .bobl{animation:bob .9s ease-in-out infinite}
.play .wv{animation:wvs .9s ease-in-out var(--dl,0s) infinite}

@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1)}}
@keyframes spin{from{transform:rotate(-360deg)}}
@keyframes spinr{from{transform:rotate(360deg)}}
@keyframes swing{20%{transform:rotate(16deg)}40%{transform:rotate(-11deg)}60%{transform:rotate(6deg)}80%{transform:rotate(-3deg)}100%{transform:rotate(0)}}
@keyframes shake{20%,60%{transform:translateX(-1.6px)}40%,80%{transform:translateX(1.6px)}100%{transform:none}}
@keyframes rise{from{transform:translateY(6px);opacity:0}}
@keyframes fall{from{transform:translateY(-6px);opacity:0}}
@keyframes drop{0%{transform:translateY(-9px);opacity:0}65%{transform:translateY(1.2px);opacity:1}100%{transform:none}}
@keyframes blink{50%{opacity:.15}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes gx{from{transform:scaleX(0)}}
@keyframes tilt{40%{transform:rotate(-28deg)}100%{transform:rotate(0)}}
@keyframes tilt2{from{transform:rotate(30deg);opacity:0}}
@keyframes beat{50%{transform:scale(1.14)}}
@keyframes sl{from{transform:translateX(-6px);opacity:0}}
@keyframes sr{from{transform:translateX(6px);opacity:0}}
@keyframes in1{from{transform:translate(-3px,-3px);opacity:0}}
@keyframes in2{from{transform:translate(3px,3px);opacity:0}}
@keyframes turn{from{transform:rotate(-70deg)}}
@keyframes fade{from{opacity:0}}
@keyframes fout{to{opacity:.2}}
@keyframes needle{from{transform:rotate(-95deg)}}
@keyframes tick{from{transform:rotate(-300deg)}}
@keyframes flip{from{transform:rotate(-180deg)}}
@keyframes lock{from{transform:translateY(-3.5px)}}
@keyframes knob{from{transform:translateX(-9px)}}
@keyframes k1{from{transform:translateX(7px)}}
@keyframes k2{from{transform:translateX(-7px)}}
@keyframes k3{from{transform:translateX(5px)}}
@keyframes press{50%{transform:translateY(1.5px)}}
@keyframes rock{25%{transform:rotate(-9deg)}75%{transform:rotate(7deg)}100%{transform:rotate(0)}}
@keyframes bob{50%{transform:translateY(-2.5px)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes scan{0%,100%{transform:translateY(-5px)}50%{transform:translateY(5px)}}
@keyframes ping{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
@keyframes wvs{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
@keyframes wv{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes barIn{from{transform:scaleX(0)}}
@keyframes ring{to{stroke-dashoffset:1}}
@keyframes shim{from{background-position:100% 0}to{background-position:-150% 0}}

/* önizleme kartı */
.card{cursor:pointer;transition:border-color .2s,transform .25s var(--e)}
.card:hover{border-color:var(--ln2);transform:translateY(-1px)}
.card:focus-visible{outline:2px solid var(--tx2);outline-offset:3px}
.card .x{pointer-events:none}

/* canlı yığın */
.stack{position:fixed;z-index:50;right:20px;bottom:20px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;width:min(370px,calc(100vw - 32px));pointer-events:none}
.stack .n{pointer-events:auto;width:100%;box-shadow:0 12px 32px rgba(0,0,0,.5);animation:tin .45s var(--e) both}
.stack .n.v-pill,.stack .n.v-banner{width:auto;max-width:100%}
.stack .n.out{animation:tout .25s ease forwards}
@keyframes tin{from{opacity:0;transform:translateY(12px) scale(.97)}}
@keyframes tout{to{opacity:0;transform:translateY(6px) scale(.97)}}
@media (max-width:560px){.stack{left:16px;right:16px;bottom:16px;width:auto;align-items:stretch}.stack .n.v-pill{align-self:center}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Neo Uyarıları</h1>
      <p class="sub"><span id="count">100</span> bildirim · her birinin kendi animasyonlu ikonu var · denemek için tıkla</p>
    </div>
    <button class="btn" id="playBtn" type="button">Rastgele 3 tane göster</button>
  </header>

  <div class="filters">
    <input class="search" id="search" type="search" placeholder="Ara… (ör. ödeme, mikrofon)" autocomplete="off">
    <div class="chips" id="typeChips"></div>
    <div class="chips" id="catChips"></div>
  </div>

  <div id="list"></div>
  <p class="empty" id="empty">Bu filtreyle eşleşen uyarı yok.</p>
</main>

<div class="stack" id="stack" aria-live="polite"></div>

<script>
/* ════════════════════════════════════════════════════
   Neo uyarıları — ikonlar ve bileşen sıfırdan yazıldı.
   neoAlert({type, variant, icon, title, desc, ...}) ile çağır.
   ════════════════════════════════════════════════════ */

// ── 100 animasyonlu ikon (24×24, çizgi) ──
const DOC = '<path d="M14 3.5H7A1.5 1.5 0 0 0 5.5 5v14A1.5 1.5 0 0 0 7 20.5h10a1.5 1.5 0 0 0 1.5-1.5V8z"/><path d="M14 3.5V8h4.5"/>';
const CLOUD = '<path d="M7 18.5h10.5a4 4 0 0 0 .5-8A6 6 0 0 0 6.4 9.5a4.5 4.5 0 0 0 .6 9z"/>';
const SHIELD = '<path d="M12 3l7.5 3v5.5c0 4.5-3.2 8.2-7.5 9.5-4.3-1.3-7.5-5-7.5-9.5V6z"/>';
const SPK = '<path d="M4 9.5h3l4.5-4v13L7 14.5H4z"/>';
const TRAY = '<path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/>';
const P = 'pathLength="1"';

const ICONS = {
  save:`<path class="dr" ${P} d="M7 3.5h10a1 1 0 0 1 1 1V20l-6-4-6 4V4.5a1 1 0 0 1 1-1z"/><path class="dr" ${P} style="--dl:.35s" d="M9.5 9.5l2 2 3-3.5"/>`,
  copy:`<path d="M15.5 8.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7.5a2 2 0 0 0 2 2h2.5"/><rect class="in2" x="8.5" y="8.5" width="11.5" height="11.5" rx="2"/>`,
  chatDots:`<path d="M12 4.5c4.4 0 8 3 8 6.8s-3.6 6.7-8 6.7c-1 0-2-.1-2.9-.4L5 19.5l1-3.4C4.8 14.9 4 13.2 4 11.3 4 7.5 7.6 4.5 12 4.5z"/><circle class="blink" cx="8.5" cy="11.3" r=".6" fill="currentColor"/><circle class="blink" style="--dl:.15s" cx="12" cy="11.3" r=".6" fill="currentColor"/><circle class="blink" style="--dl:.3s" cx="15.5" cy="11.3" r=".6" fill="currentColor"/>`,
  trash:`<path class="tilt vb" style="transform-origin:4.5px 7px" d="M4 7h16M9.5 7V4.5h5V7"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v5M14 11v5"/>`,
  lines:`<path class="gx ol" d="M4 6h16"/><path class="gx ol" style="--dl:.1s" d="M4 10h16"/><path class="gx ol" style="--dl:.2s" d="M4 14h16"/><path class="gx ol" style="--dl:.3s" d="M4 18h9"/><circle class="pop" style="--dl:.55s" cx="18.5" cy="18" r=".6" fill="currentColor"/>`,
  cursor:`<rect x="3" y="6.5" width="18" height="11" rx="3"/><path class="blink" d="M8 9.5v5"/>`,
  planeFail:`<g class="shake"><path d="M21 3.5 3.5 10.5l7 3 3 7z"/><path d="M10.5 13.5 21 3.5"/></g>`,
  sparkle:`<path class="pop" d="M12 3.5c.6 3.7 2.8 5.9 6.5 6.5-3.7.6-5.9 2.8-6.5 6.5-.6-3.7-2.8-5.9-6.5-6.5 3.7-.6 5.9-2.8 6.5-6.5z"/><path class="pop" style="--dl:.25s" d="M18.5 16.5v4M16.5 18.5h4"/>`,
  historyClear:`<g class="spinr"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5V8H8"/></g>`,
  link:`<path class="sl" d="M10 14a4 4 0 0 1 0-5.7l2.3-2.3a4 4 0 0 1 5.7 5.7l-1.2 1.2"/><path class="sr" d="M14 10a4 4 0 0 1 0 5.7L11.7 18a4 4 0 0 1-5.7-5.7l1.2-1.2"/>`,

  swap:`<path class="sl" d="M4 8.5h15m0 0-3.5-3.5M19 8.5l-3.5 3.5"/><path class="sr" style="--dl:.15s" d="M20 15.5H5m0 0 3.5-3.5M5 15.5 8.5 19"/>`,
  orbit:`<circle cx="12" cy="12" r="2.6"/><g class="orbit vb" style="transform-origin:12px 12px"><circle cx="12" cy="12" r="8" stroke-dasharray="1.5 3.5" opacity=".5"/><circle cx="20" cy="12" r="1.4" fill="currentColor" stroke="none"/></g>`,
  gauge:`<path d="M4 17.5a8 8 0 1 1 16 0"/><path class="needle vb" style="transform-origin:12px 17.5px" d="M12 17.5l4.2-4.8"/><circle cx="12" cy="17.5" r=".8" fill="currentColor"/>`,
  server:`<rect x="4" y="4" width="16" height="7" rx="1.5"/><rect x="4" y="13" width="16" height="7" rx="1.5"/><circle class="blink" cx="7.5" cy="7.5" r=".6" fill="currentColor"/><circle cx="7.5" cy="16.5" r=".6" fill="currentColor"/><path d="M11 7.5h5.5M11 16.5h5.5" opacity=".45"/>`,
  hourglass:`<g class="flip"><path d="M7 3.5h10M7 20.5h10"/><path d="M8 3.5c0 4 4 5 4 8.5s-4 4.5-4 8.5M16 3.5c0 4-4 5-4 8.5s4 4.5 4 8.5"/></g>`,

// ── bileşen ──
function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

function buildAlert(a){
  const n = el('div', 'n '+a.type+' v-'+a.variant);
  n.setAttribute('role', a.type==='err'||a.type==='warn' ? 'alert' : 'status');
  const row = el('div','row');
  const ic = el('div','ic'); ic.innerHTML = svg(a.icon);
  const tx = el('div','tx');
  const t = el('div', a.variant==='loading' ? 't shim' : 't', a.title);
  if(a.badge) t.append(el('span','badge',a.badge));
  tx.append(t);
  if(a.desc && a.variant!=='pill') tx.append(el('div','d',a.desc));

  if(a.variant==='meta'){ const m=el('div','meta'); m.append('şimdi', el('i'), a.meta); tx.append(m); }
  if(a.variant==='progress'){
    const b=el('div','bar'); const s=el('span'); s.style.setProperty('--v',a.value+'%'); b.append(s);
    const pv=el('div','pv'); pv.append(el('span',null,a.label), el('span',null,'%'+a.value));
    tx.append(b,pv);
  }
  if(a.variant==='file'){
    const f=el('div','file'); f.append(el('div','fi',a.file[0]), el('b',null,a.file[1]), el('span',null,a.file[2])); tx.append(f);
  }
  if(a.variant==='kbd'){
    const k=el('div','keys'); k.append(el('kbd',null,a.keys[0]), '+', el('kbd',null,a.keys[1])); tx.append(k);
  }
  if(a.variant==='wave'){
    const w=el('div','wave');
    for(let i=0;i<28;i++){ const b=el('i'); b.style.animationDelay=(-(i*.13)%1.1).toFixed(2)+'s'; b.style.height=(40+Math.abs(Math.sin(i*1.7))*60)+'%'; w.append(b); }
    tx.append(w);
  }
  if(a.variant==='strength'){
    const s=el('div','str'); for(let i=0;i<4;i++) s.append(el('i', i<a.level?'on':null)); tx.append(s);
  }

  row.append(ic, tx);
  if(a.variant==='undo'){
    const u=el('button','lnk',a.action); u.type='button'; row.append(u);
    const r=document.createElementNS('http://www.w3.org/2000/svg','svg');
    r.setAttribute('viewBox','0 0 20 20'); r.setAttribute('class','ring');
    r.innerHTML='<circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="2"/><circle class="rg" cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="2" pathLength="1" transform="rotate(-90 10 10)"/>';
    row.append(r);
  } else if(a.variant==='banner'){
    if(a.action){ const u=el('button','lnk',a.action); u.type='button'; row.append(u); }
  }
  if(a.variant!=='pill' && a.variant!=='undo'){
    const x=el('button','x'); x.type='button'; x.setAttribute('aria-label','Kapat'); x.innerHTML=CLOSE; row.append(x);
  }
  n.append(row);

  if(a.variant==='action'){
    const acts=el('div','acts');
    const c=el('button','b','Kapat'); c.type='button'; c.dataset.close='';
    const p=el('button','b p',a.action); p.type='button'; p.dataset.act='';
    acts.append(c,p); n.append(acts);
  }
  return n;
}

function play(n){ n.classList.remove('play'); void n.offsetWidth; n.classList.add('play'); }

function neoAlert(a){
  const stack=document.getElementById('stack');
  const n=buildAlert(a);
  const close=()=>{ if(n.classList.contains('out')) return; n.classList.add('out'); setTimeout(()=>n.remove(),260); };
  n.querySelectorAll('.x,[data-close],[data-act],.lnk').forEach(b=>b.addEventListener('click',()=>{ if(b.matches('[data-act],.lnk')&&a.onAction) a.onAction(); close(); }));
  let timer=setTimeout(close, a.variant==='loading'||a.variant==='wave' ? 6000 : 5000);
  n.addEventListener('mouseenter',()=>clearTimeout(timer));
  n.addEventListener('mouseleave',()=>{ timer=setTimeout(close,2500); });
  stack.prepend(n);
  requestAnimationFrame(()=>play(n));
  const max = matchMedia('(max-width:560px)').matches ? 2 : 3;
  while(stack.children.length>max) stack.lastElementChild.remove();
  return close;
}

// ── galeri ──
const state={type:'all',cat:'all',q:''};
const $=id=>document.getElementById(id);
const TYPES={ok:['Başarılı','var(--ok)'],info:['Bilgi','var(--info)'],warn:['Uyarı','var(--warn)'],err:['Hata','var(--err)'],ai:['Neo','var(--ai)']};

const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ play(e.target); io.unobserve(e.target); } }),{threshold:.6});

function chip(label,value,key,color){
  const b=el('button','chip'); b.type='button'; b.setAttribute('aria-pressed',state[key]===value);
  if(color){ const i=el('i'); i.style.setProperty('--c',color); b.append(i); }
  b.append(label);
  b.addEventListener('click',()=>{ state[key]=value; renderChips(); render(); });
  return b;
}
function renderChips(){
  $('typeChips').replaceChildren(chip('Tümü','all','type'), ...Object.entries(TYPES).map(([k,[l,c]])=>chip(l,k,'type',c)));
  $('catChips').replaceChildren(chip('Tüm kategoriler','all','cat'), ...[...new Set(ALERTS.map(a=>a.cat))].map(c=>chip(c,c,'cat')));
}
function render(){
  const q=state.q.toLocaleLowerCase('tr');
  const shown=ALERTS.filter(a=>(state.type==='all'||a.type===state.type)&&(state.cat==='all'||a.cat===state.cat)&&(!q||(a.title+' '+(a.desc||'')+' '+a.cat).toLocaleLowerCase('tr').includes(q)));
  const groups={}; shown.forEach(a=>(groups[a.cat]||=[]).push(a));
  $('list').replaceChildren(...Object.entries(groups).map(([cat,items])=>{
    const s=el('section'); const g=el('div','grid');
    items.forEach(a=>{
      const n=buildAlert(a); n.classList.add('card'); n.tabIndex=0; n.removeAttribute('role');
      n.setAttribute('aria-label',a.title+' — göstermek için tıkla');
      n.querySelectorAll('button').forEach(b=>b.tabIndex=-1);
      n.addEventListener('click',()=>neoAlert(a));
      n.addEventListener('mouseenter',()=>play(n));
      n.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); neoAlert(a); } });
      io.observe(n); g.append(n);
    });
    s.append(el('h2',null,cat), g); return s;
  }));
  $('count').textContent=shown.length;
  $('empty').style.display=shown.length?'none':'block';
}

$('search').addEventListener('input',e=>{ state.q=e.target.value.trim(); render(); });
$('playBtn').addEventListener('click',()=>{ [...ALERTS].sort(()=>Math.random()-.5).slice(0,3).forEach((a,i)=>setTimeout(()=>neoAlert(a),i*400)); });
renderChips(); render();
