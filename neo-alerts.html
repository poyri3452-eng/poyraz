<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neo Uyarıları</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090e;--s1:#0d0f14;--s2:#13151d;--s3:#191c27;
  --b1:rgba(255,255,255,.055);--b2:rgba(255,255,255,.1);--b3:rgba(255,255,255,.18);
  --ac:#a78bfa;--ac2:#7c3aed;--pi:#f472b6;--cy:#67e8f9;
  --go:#fbbf24;--er:#f87171;--gr:#4ade80;
  --tx:#f0f0f8;--tx2:#b8b8cc;--mu:#6b7280;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}

/* arka plan ışıkları */
.orb{position:fixed;border-radius:50%;filter:blur(110px);pointer-events:none;z-index:0}
.orb.a{width:min(760px,170vw);height:min(760px,170vw);background:#7c3aed22;top:-30%;right:-20%;animation:float 22s ease-in-out infinite}
.orb.b{width:min(560px,140vw);height:min(560px,140vw);background:#67e8f910;bottom:-25%;left:-20%;animation:float 26s ease-in-out infinite reverse}
@keyframes float{50%{transform:translate(-40px,30px) scale(1.06)}}

main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:56px 16px 120px}

/* başlık */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#a78bfa,#7c3aed);display:grid;place-items:center;font-family:'Syne',sans-serif;font-weight:800;font-size:20px;color:#fff;box-shadow:0 0 40px rgba(167,139,250,.35)}
h1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(28px,4vw,40px);letter-spacing:-.02em;line-height:1.05}
h1 span{background:linear-gradient(135deg,#a78bfa 0%,#7c3aed 45%,#ec4899 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--tx2);font-size:14px;margin-top:6px}
.play{appearance:none;border:1px solid var(--b2);background:linear-gradient(135deg,rgba(167,139,250,.18),rgba(124,58,237,.12));color:var(--tx);font:600 14px 'DM Sans',sans-serif;padding:11px 18px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .2s var(--ease),border-color .2s}
.play:hover{transform:translateY(-1px);border-color:var(--b3)}
.play svg{width:16px;height:16px}

/* filtreler */
.bar{margin:0 0 28px;display:flex;flex-direction:column;gap:10px}
.search{width:100%;max-width:420px;background:var(--s2);border:1px solid var(--b2);border-radius:12px;padding:11px 14px;color:var(--tx);font:500 14px 'DM Sans',sans-serif;outline:none;transition:border-color .2s}
.search:focus{border-color:rgba(167,139,250,.5)}
.search::placeholder{color:var(--mu)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;appearance:none;border:1px solid var(--b1);background:var(--s1);color:var(--tx2);font:500 13px 'DM Sans',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.chip:hover{color:var(--tx);border-color:var(--b2)}
.chip[aria-pressed="true"]{background:var(--s3);color:var(--tx);border-color:var(--b3)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--mu))}

/* bölümler */
section{margin-bottom:36px}
section h2{font:600 12px 'DM Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-bottom:12px;display:flex;align-items:center;gap:10px}
section h2::after{content:"";flex:1;height:1px;background:var(--b1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.empty{color:var(--mu);text-align:center;padding:60px 0;display:none}

/* ─── UYARI ─── */
.na{
  --c:var(--ac);
  position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;
  padding:14px 14px 14px 14px;border-radius:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012)),rgba(13,15,20,.82);
  border:1px solid var(--b1);
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -12px rgba(0,0,0,.6);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  overflow:hidden;text-align:left;
}
.na::before{content:"";position:absolute;inset:0 auto 0 0;width:2px;background:var(--c);opacity:.9;box-shadow:0 0 18px 1px var(--c)}
.na::after{content:"";position:absolute;inset:-40% auto auto -10%;width:160px;height:120px;background:radial-gradient(closest-side,var(--c),transparent);opacity:.08;pointer-events:none}
.na.ok{--c:var(--gr)}.na.info{--c:var(--cy)}.na.warn{--c:var(--go)}.na.err{--c:var(--er)}.na.ai{--c:var(--ac)}
.na-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 26%,transparent)}
.na-ic svg{width:17px;height:17px}
.na-t{font-weight:600;font-size:14.5px;line-height:1.3;color:var(--tx);padding-top:1px}
.na-d{font-size:13px;line-height:1.5;color:var(--tx2);margin-top:3px}
.na-a{margin-top:9px;appearance:none;border:1px solid color-mix(in srgb,var(--c) 35%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c);font:600 12.5px 'DM Sans',sans-serif;padding:5px 11px;border-radius:8px;cursor:pointer;transition:background .15s}
.na-a:hover{background:color-mix(in srgb,var(--c) 22%,transparent)}
.na-x{appearance:none;border:0;background:none;color:var(--mu);width:26px;height:26px;border-radius:8px;display:grid;place-items:center;cursor:pointer;transition:all .15s}
.na-x:hover{background:var(--b1);color:var(--tx)}
.na-x svg{width:14px;height:14px}
.na-p{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--c);transform-origin:left;opacity:.7}

/* yapay zeka türü: dönen gradyan kenar */
.na.ai{border-color:transparent;background:
  linear-gradient(rgba(13,15,20,.92),rgba(13,15,20,.92)) padding-box,
  conic-gradient(from var(--ang,0deg),#a78bfa,#ec4899,#67e8f9,#7c3aed,#a78bfa) border-box;
  animation:spin 6s linear infinite}
.na.ai .na-ic{background:linear-gradient(135deg,rgba(167,139,250,.25),rgba(236,72,153,.18))}
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes spin{to{--ang:360deg}}

/* önizleme kartı */
.card{cursor:pointer;transition:transform .25s var(--ease),border-color .2s}
.card:hover{transform:translateY(-2px)}
.card:not(.ai):hover{border-color:var(--b2)}
.card:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.card .na-x{pointer-events:none}
.tag{position:absolute;right:44px;top:16px;font-size:10.5px;color:var(--mu);letter-spacing:.04em}

/* canlı bildirim yığını */
.stack{position:fixed;z-index:50;right:20px;bottom:20px;display:flex;flex-direction:column-reverse;gap:10px;width:min(380px,calc(100vw - 32px));pointer-events:none}
.stack .na{pointer-events:auto;animation:in .45s var(--ease) both;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015)),rgba(13,15,20,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 18px 50px -10px rgba(0,0,0,.8)}
.stack .na.ai{background:linear-gradient(#0d0f14,#0d0f14) padding-box,conic-gradient(from var(--ang,0deg),#a78bfa,#ec4899,#67e8f9,#7c3aed,#a78bfa) border-box}
.stack .na.ai{animation:in .45s var(--ease) both,spin 6s linear infinite}
.stack .na.out{animation:out .3s ease forwards}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.96);filter:blur(4px)}}
@keyframes out{to{opacity:0;transform:translateX(24px) scale(.97)}}
.stack .na-p{animation:prog var(--dur,5s) linear forwards}
.stack .na:hover .na-p{animation-play-state:paused}
@keyframes prog{to{transform:scaleX(0)}}
@media (max-width:560px){.stack{left:16px;right:16px;bottom:16px;width:auto}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}
</style>
</head>
<body>
<div class="orb a"></div><div class="orb b"></div>

<main>
  <header class="hero">
    <div>
      <div class="brand">
        <div class="logo">N</div>
        <div>
          <h1>Neo <span>Uyarıları</span></h1>
          <p class="sub"><b id="count">100</b> hazır bildirim · denemek için birine tıkla</p>
        </div>
      </div>
    </div>
    <button class="play" id="playBtn" type="button">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
      Rastgele 3 tane oynat
    </button>
  </header>

  <div class="bar">
    <input class="search" id="search" type="search" placeholder="Uyarı ara… (ör. ödeme, mikrofon)" autocomplete="off">
    <div class="chips" id="typeChips"></div>
    <div class="chips" id="catChips"></div>
  </div>

  <div id="list"></div>
  <p class="empty" id="empty">Bu filtreyle eşleşen uyarı yok.</p>
</main>

<div class="stack" id="stack" aria-live="polite"></div>

<script>
/* ══════════════════════════════════════════
   Neo uyarı bileşeni — sıfırdan yazıldı.
   Kullanım: neoAlert({type:'ok', title:'…', desc:'…', action:'…', onAction(){}, duration:5000})
   Türler: ok · info · warn · err · ai
   ══════════════════════════════════════════ */
const ICONS = {
  ok:   '<path d="M20 6 9 17l-5-5"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  warn: '<path d="M12 3.5 2.8 19.5h18.4L12 3.5z"/><path d="M12 10v4M12 17h.01"/>',
  err:  '<circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/>',
  ai:   '<path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><path d="M12 7.5 13.4 10.6 16.5 12 13.4 13.4 12 16.5 10.6 13.4 7.5 12 10.6 10.6z"/>'
};
const CLOSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
const TYPE_NAMES = {ok:'Başarılı',info:'Bilgi',warn:'Uyarı',err:'Hata',ai:'Neo'};

function svgIcon(type){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICONS[type]+'</svg>';
}

function buildAlert(a){
  const el = document.createElement('div');
  el.className = 'na '+a.type;
  el.setAttribute('role', a.type==='err'||a.type==='warn' ? 'alert' : 'status');

  const ic = document.createElement('div');
  ic.className = 'na-ic';
  ic.innerHTML = svgIcon(a.type);

  const body = document.createElement('div');
  const t = document.createElement('div'); t.className='na-t'; t.textContent=a.title;
  const d = document.createElement('div'); d.className='na-d'; d.textContent=a.desc;
  body.append(t,d);
  if(a.action){
    const btn = document.createElement('button');
    btn.type='button'; btn.className='na-a'; btn.textContent=a.action;
    body.append(btn);
  }

  const x = document.createElement('button');
  x.type='button'; x.className='na-x'; x.setAttribute('aria-label','Kapat'); x.innerHTML=CLOSE;

  el.append(ic,body,x);
  return el;
}

function neoAlert(a){
  const stack = document.getElementById('stack');
  const el = buildAlert(a);
  const dur = a.duration ?? 5000;
  const bar = document.createElement('div'); bar.className='na-p';
  el.style.setProperty('--dur', dur+'ms');
  el.append(bar);

  const close = () => {
    if(el.classList.contains('out')) return;
    el.classList.add('out');
    el.addEventListener('animationend', () => el.remove(), {once:true});
  };
  el.querySelector('.na-x').addEventListener('click', close);
  const act = el.querySelector('.na-a');
  if(act) act.addEventListener('click', () => { a.onAction && a.onAction(); close(); });
  bar.addEventListener('animationend', close);

  stack.append(el);
  const max = matchMedia('(max-width:560px)').matches ? 2 : 4;
  while(stack.children.length > max) stack.firstElementChild.remove();
  return close;
}

/* ══════════════════════════════════════════
   Galeri
   ══════════════════════════════════════════ */
const state = {type:'all', cat:'all', q:''};
const $ = id => document.getElementById(id);
const TYPE_COLORS = {ok:'var(--gr)',info:'var(--cy)',warn:'var(--go)',err:'var(--er)',ai:'var(--ac)'};

function chip(label, value, key, color){
  const b = document.createElement('button');
  b.type='button'; b.className='chip';
  b.setAttribute('aria-pressed', state[key]===value);
  if(color){ const i=document.createElement('i'); i.style.setProperty('--c',color); b.append(i); }
  b.append(label);
  b.addEventListener('click', () => { state[key]=value; renderChips(); render(); });
  return b;
}

function renderChips(){
  const tc = $('typeChips'); tc.replaceChildren(chip('Tüm türler','all','type'));
  for(const t of Object.keys(TYPE_NAMES)) tc.append(chip(TYPE_NAMES[t], t, 'type', TYPE_COLORS[t]));
  const cc = $('catChips'); cc.replaceChildren(chip('Tüm kategoriler','all','cat'));
  for(const c of [...new Set(ALERTS.map(a=>a.cat))]) cc.append(chip(c, c, 'cat'));
}

function render(){
  const q = state.q.toLocaleLowerCase('tr');
  const shown = ALERTS.filter(a =>
    (state.type==='all' || a.type===state.type) &&
    (state.cat==='all' || a.cat===state.cat) &&
    (!q || (a.title+' '+a.desc+' '+a.cat).toLocaleLowerCase('tr').includes(q))
  );
  const list = $('list'); list.replaceChildren();
  const groups = {};
  shown.forEach(a => (groups[a.cat] ||= []).push(a));
  for(const [cat, items] of Object.entries(groups)){
    const sec = document.createElement('section');
    const h = document.createElement('h2'); h.textContent = cat+' · '+items.length;
    const grid = document.createElement('div'); grid.className='grid';
    for(const a of items){
      const card = buildAlert(a);
      card.classList.add('card');
      card.tabIndex = 0;
      card.removeAttribute('role');
      card.setAttribute('aria-label', a.title+' — önizlemek için tıkla');
      const fire = () => neoAlert(a);
      card.addEventListener('click', fire);
      card.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); fire(); } });
      grid.append(card);
    }
    sec.append(h, grid);
    list.append(sec);
  }
  $('count').textContent = shown.length;
  $('empty').style.display = shown.length ? 'none' : 'block';
}

$('search').addEventListener('input', e => { state.q = e.target.value.trim(); render(); });
$('playBtn').addEventListener('click', () => {
  const pick = [...ALERTS].sort(() => Math.random() - .5).slice(0,3);
  pick.forEach((a,i) => setTimeout(() => neoAlert(a), i*350));
});

renderChips();
render();
setTimeout(() => neoAlert(ALERTS.find(a => a.title==='Yeni sürüm hazır')), 600);
</script>
